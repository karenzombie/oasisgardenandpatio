  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a presigned URL for uploading a file (staff only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestUploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestUploadUrlResponseSchema"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not staff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/customers:
    get:
      operationId: adminListCustomers
      tags: [admin-customers]
      summary: Search customers (newest first)
      parameters:
        - name: q
          in: query
          required: false
          description: Match email, name, phone, or company
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Customers page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCustomerPage" }
    post:
      operationId: adminCreateCustomer
      tags: [admin-customers]
      summary: Create a new customer record
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCustomerRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCreateCustomerResponse" }
        "400": { description: Bad request, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: Conflict, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /admin/customers/{id}:
    get:
      operationId: adminGetCustomer
      tags: [admin-customers]
      summary: Customer detail with addresses
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Customer detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCustomerDetail" }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    patch:
      operationId: adminUpdateCustomer
      tags: [admin-customers]
      summary: Update customer fields
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCustomerRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCustomer" }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /admin/customers/{id}/addresses:
    post:
      operationId: adminCreateCustomerAddress
      tags: [admin-customers]
      summary: Add an address to a customer
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAddressRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAddress" }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /admin/customers/{id}/addresses/{addressId}:
    patch:
      operationId: adminUpdateCustomerAddress
      tags: [admin-customers]
      summary: Update one of a customer's addresses
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: addressId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAddressRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAddress" }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /admin/wishlists:
    get:
      operationId: adminListWishlists
      tags: [admin-wishlists]
      summary: List customer wishlists with at least one item (most recent save first)
      parameters:
        - name: q
          in: query
          required: false
          description: Match wishlist number, customer email, or customer name
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Wishlists page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminWishlistPage" }
  /admin/wishlists/{customerId}:
    get:
      operationId: adminGetWishlist
      tags: [admin-wishlists]
      summary: Wishlist detail for a customer (items, live pricing, marketing contact state)
      parameters:
        - name: customerId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Wishlist detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminWishlistDetail" }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /admin/wishlists/{customerId}/pdf:
    get:
      operationId: adminGetWishlistPdf
      tags: [admin-wishlists]
      summary: Generate the printable "Wishlist Copy" PDF for a customer's wishlist (staff)
      parameters:
        - name: customerId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: PDF bytes
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /admin/wishlists/{customerId}/reach-out-email/preview:
    post:
      operationId: adminPreviewWishlistReachOutEmail
      tags: [admin-wishlists]
      summary: Render the staff reach-out email HTML for preview, without sending it (staff)
      parameters:
        - name: customerId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminWishlistReachOutEmailBody" }
      responses:
        "200":
          description: Rendered email HTML
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminWishlistReachOutPreviewResponse" }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /admin/wishlists/{customerId}/reach-out-email/send:
    post:
      operationId: adminSendWishlistReachOutEmail
      tags: [admin-wishlists]
      summary: Send the staff reach-out email for a customer's wishlist and log it for audit (staff)
      parameters:
        - name: customerId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminWishlistReachOutEmailBody" }
      responses:
        "200":
          description: Email sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminWishlistReachOutSendResponse" }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409":
          description: Customer has opted out of marketing contact
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /cushions/orders:
    post:
      operationId: submitCushionOrder
      tags: [cushions]
      summary: Create a custom or stock cushion order on behalf of a customer (staff)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitCushionOrderRequest" }
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CushionOrderSubmitted" }
        "400": { description: Invalid, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    get:
      operationId: listCushionOrders
      tags: [cushions]
      summary: List cushion orders (staff)
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [submitted, in_review, ordered, complete] }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Cushion orders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CushionOrderPage" }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { description: Forbidden, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /cushions/orders/{id}:
    get:
      operationId: getCushionOrder
      tags: [cushions]
      summary: Get a cushion order with items (staff)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Cushion order detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CushionOrderDetail" }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    patch:
      operationId: updateCushionOrder
      tags: [cushions]
      summary: Update status / agent notes (staff)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCushionOrderRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CushionOrderDetail" }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /cushions/orders/{id}/email:
    post:
      operationId: sendCushionOrderEmail
      tags: [cushions]
      summary: Resend customer confirmation email (staff)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SendCushionEmailResponse" }
        "400": { description: No email on file, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /cushions/orders/{id}/pdf:
    get:
      operationId: getCushionOrderPdf
      tags: [cushions]
      summary: Generate the vendor PDF for a cushion order (staff)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: PDF bytes
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    AuditLogEntry:
      type: object
      properties:
        id: { type: integer }
        userId: { type: integer, nullable: true }
        userEmail: { type: string, nullable: true }
        action: { type: string }
        entityType: { type: string, nullable: true }
        entityId: { type: integer, nullable: true }
        changes: {}
        ipAddress: { type: string, nullable: true }
        userAgent: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
      required:
        [id, userId, userEmail, action, entityType, entityId, ipAddress, userAgent, createdAt]
    AuditLogPage:
      type: object
      properties:
        rows:
          type: array
          items: { $ref: "#/components/schemas/AuditLogEntry" }
        total: { type: integer }
      required: [rows, total]
    AdminRefundOrderRequest:
      type: object
      properties:
        grossRefundAmount: { type: number, description: "Full refund amount before any restocking fee" }
        restockingFeeType: { type: string, enum: [flat, percent], nullable: true }
        restockingFeeValue: { type: number, nullable: true, description: "Flat dollar amount, or percentage 0-100" }
        note: { type: string, nullable: true }
      required: [grossRefundAmount]
    UpdateOrderStatusRequest:
      type: object
      properties:
        toStatus: { type: string }
        note: { type: string, nullable: true }
      required: [toStatus]
    UpdateOrderNotesRequest:
      type: object
      properties:
        notes: { type: string, nullable: true }
      required: [notes]
    ReviewCancellationRequest:
      type: object
      properties:
        decision: { type: string, enum: [approved, denied] }
        reviewNote: { type: string, nullable: true }
        refundAmount: { type: number, nullable: true }
      required: [decision]
    AdminOrderSummary:
      type: object
      properties:
        id: { type: integer }
        orderNumber: { type: string }
        status: { type: string }
        orderType: { type: string }
        total: { type: number }
        balanceDue: { type: number }
        customerId: { type: integer, nullable: true }
        customerName: { type: string, nullable: true }
        customerEmail: { type: string, nullable: true }
        agentId: { type: integer, nullable: true }
        agentName: { type: string, nullable: true }
        itemCount: { type: integer }
        placedAt: { type: string, format: date-time }
        isInternalRestock: { type: boolean }
      required:
        [id, orderNumber, status, orderType, total, balanceDue, customerId, customerName, customerEmail, agentId, agentName, itemCount, placedAt, isInternalRestock]
    AdminOrderPage:
      type: object
      properties:
        rows:
          type: array
          items: { $ref: "#/components/schemas/AdminOrderSummary" }
        total: { type: integer }
      required: [rows, total]
    AdminWishlistSummary:
      type: object
      properties:
        customerId: { type: integer }
        wishlistNumber: { type: string }
        customerName: { type: string }
        customerEmail: { type: string }
        itemCount: { type: integer }
        mostRecentSaveAt: { type: string, format: date-time }
        marketingOptOut: { type: boolean }
        marketingOptOutAt: { type: string, format: date-time, nullable: true }
      required:
        [customerId, wishlistNumber, customerName, customerEmail, itemCount, mostRecentSaveAt, marketingOptOut, marketingOptOutAt]
    AdminWishlistPage:
      type: object
      properties:
        rows:
          type: array
          items: { $ref: "#/components/schemas/AdminWishlistSummary" }
        total: { type: integer }
      required: [rows, total]
    AdminWishlistItem:
      type: object
      properties:
        id: { type: integer }
        productId: { type: integer, nullable: true }
        description: { type: string }
        sku: { type: string, nullable: true }
        variantLabel: { type: string, nullable: true }
        quantity: { type: integer }
        unitPrice:
          type: number
          nullable: true
          description: "Live sale-or-MSRP price read from the product at request time. Null if the product no longer exists or has no price on file."
        amount: { type: number, nullable: true }
        addedAt: { type: string, format: date-time }
        manufacturerName:
          type: string
          nullable: true
          description: "Manufacturer of the product on this wishlist item. Derived from products.manufacturerId at response time."
        lastReachOutSentAt:
          type: string
          format: date-time
          nullable: true
          description: "Most recent time a reach-out email that included this item was sent. Null if never included in a send."
      required: [id, productId, description, sku, variantLabel, quantity, unitPrice, amount, addedAt, manufacturerName, lastReachOutSentAt]
    AdminWishlistDetail:
      type: object
      properties:
        customerId: { type: integer }
        wishlistNumber: { type: string }
        createdAt: { type: string, format: date-time }
        customerName: { type: string }
        customerEmail: { type: string }
        customerPhone: { type: string, nullable: true }
        marketingOptOut: { type: boolean }
        marketingOptOutAt: { type: string, format: date-time, nullable: true }
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminWishlistItem" }
        subtotal: { type: number }
        hasUnpricedItems: { type: boolean }
        statusHistory:
          type: array
          items: { $ref: "#/components/schemas/AdminWishlistStatusEvent" }
      required:
        [customerId, wishlistNumber, createdAt, customerName, customerEmail, customerPhone, marketingOptOut, marketingOptOutAt, items, subtotal, hasUnpricedItems, statusHistory]
    AdminWishlistStatusEvent:
      type: object
      properties:
        id: { type: integer }
        eventType:
          type: string
          enum: [item_added, reach_out_sent, opt_out, opt_in]
        createdAt: { type: string, format: date-time }
        staffEmail:
          type: string
          nullable: true
          description: "Staff email for staff-triggered events; null for customer-triggered events (item_added, opt_out, opt_in)."
        productName:
          type: string
          nullable: true
          description: "Populated for item_added events."
        itemCount:
          type: integer
          nullable: true
          description: "Populated for reach_out_sent events."
        itemNames:
          type: array
          items: { type: string }
          nullable: true
          description: "Populated for reach_out_sent events; full list of item names included in that send, in send order."
      required: [id, eventType, createdAt, staffEmail, productName, itemCount, itemNames]
    AdminWishlistReachOutEmailBody:
      type: object
      properties:
        personalNote:
          type: string
          nullable: true
          description: "Optional free-text note appended to the bottom of the email. Trimmed; blank/whitespace-only is treated as no note."
        itemIds:
          type: array
          items: { type: integer }
          minItems: 1
          description: "Wishlist item row ids to include in the email. Must be a non-empty subset of the customer's current wishlist items."
      required: [personalNote, itemIds]
    AdminWishlistReachOutPreviewResponse:
      type: object
      properties:
        html:
          type: string
          description: "Fully-rendered HTML of the email exactly as it will be sent, including the base template wrapper."
      required: [html]
    AdminWishlistReachOutSendResponse:
      type: object
      properties:
        customerEmail: { type: string }
        sentAt: { type: string, format: date-time }
        itemIds:
          type: array
          items: { type: integer }
          description: "Wishlist item row ids that were included in this send, for client-side status updates."
      required: [customerEmail, sentAt, itemIds]
    AdminLocalDeliverySummary:
      allOf:
        - $ref: "#/components/schemas/AdminOrderSummary"
        - type: object
          properties:
            scheduledDeliveryDate: { type: string, format: date, nullable: true }
            scheduledDeliveryTime: { type: string, nullable: true }
          required: [scheduledDeliveryDate, scheduledDeliveryTime]
    AdminLocalDeliveryPage:
      type: object
      properties:
        rows:
          type: array
          items: { $ref: "#/components/schemas/AdminLocalDeliverySummary" }
        total: { type: integer }
      required: [rows, total]
    AdminDirectShipSummary:
      type: object
      properties:
        shipmentId: { type: integer }
        orderId: { type: integer }
        orderNumber: { type: string }
        status: { type: string }
        carrierName: { type: string, nullable: true }
        trackingNumber: { type: string, nullable: true }
        orderType: { type: string }
        customerName: { type: string, nullable: true }
        customerEmail: { type: string, nullable: true }
        itemCount: { type: integer }
        total: { type: number }
        balanceDue: { type: number }
        placedAt: { type: string, format: date-time }
      required:
        [shipmentId, orderId, orderNumber, status, carrierName, trackingNumber, orderType, customerName, customerEmail, itemCount, total, balanceDue, placedAt]
    AdminDirectShipPage:
      type: object
      properties:
        rows:
          type: array
          items: { $ref: "#/components/schemas/AdminDirectShipSummary" }
        total: { type: integer }
      required: [rows, total]
    CompletedDeliveryShipmentPair:
      type: object
      properties:
        carrierName: { type: string, nullable: true }
        trackingNumber: { type: string }
      required: [carrierName, trackingNumber]
    AdminCompletedDeliverySummary:
      allOf:
        - $ref: "#/components/schemas/AdminOrderSummary"
        - type: object
          properties:
            deliveryType: { type: string, enum: [local, direct_ship] }
            shipments:
              type: array
              items: { $ref: "#/components/schemas/CompletedDeliveryShipmentPair" }
          required: [deliveryType, shipments]
    AdminCompletedDeliveryPage:
      type: object
      properties:
        rows:
          type: array
          items: { $ref: "#/components/schemas/AdminCompletedDeliverySummary" }
        total: { type: integer }
      required: [rows, total]
    AdminOrderItem:
      type: object
      properties:
        id: { type: integer }
        productId: { type: integer, nullable: true }
        productSkuSnapshot: { type: string, nullable: true }
        variantSkuSnapshot: { type: string, nullable: true }
        variantNameSnapshot: { type: string, nullable: true }
        finishId: { type: integer, nullable: true }
        finishCodeSnapshot: { type: string, nullable: true }
        finishNameSnapshot: { type: string, nullable: true }
        finialId: { type: integer, nullable: true }
        finialCodeSnapshot: { type: string, nullable: true }
        finialNameSnapshot: { type: string, nullable: true }
        fabricId: { type: integer, nullable: true }
        fabricNameSnapshot: { type: string, nullable: true }
        fabricItemNumberSnapshot: { type: string, nullable: true }
        fabricBrandSnapshot: { type: string, nullable: true }
        fabricGradeSnapshot: { type: string, nullable: true }
        unitMsrpSnapshot: { type: string, nullable: true }
        weightSnapshot: { type: string, nullable: true }
        fabricVendorId:
          type: integer
          nullable: true
          description: "Optional alternate vendor for this line's fabric. Null = fabric ships with the product vendor (the default)."
        fabricVendorName: { type: string, nullable: true }
        fabricVendorOrderId:
          type: integer
          nullable: true
          description: "When fabricVendorId is set, this is the id of the separate vendor PO that the fabric was assigned to."
        department: { type: string, nullable: true }
        description: { type: string }
        quantity: { type: integer }
        unitPrice: { type: number }
        amount: { type: number }
        discountAmount: { type: number }
        discountReason: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        manufacturerName:
          type: string
          nullable: true
          description: "Manufacturer of the product on this line item. Derived from products.manufacturerId at response time."
        vendorOrderId: { type: integer, nullable: true }
        useInventory: { type: boolean, description: "When true this line is sourced from store inventory (staff orders only)." }
        inventoryQtyUsed: { type: integer, description: "Units drawn from store inventory at order creation time. 0 when useInventory is false." }
      required:
        [id, productId, productSkuSnapshot, variantSkuSnapshot, variantNameSnapshot, finishId, finishCodeSnapshot, finishNameSnapshot, finialId, finialCodeSnapshot, finialNameSnapshot, fabricId, fabricNameSnapshot, fabricItemNumberSnapshot, fabricBrandSnapshot, fabricGradeSnapshot, unitMsrpSnapshot, weightSnapshot, fabricVendorId, fabricVendorName, fabricVendorOrderId, department, description, quantity, unitPrice, amount, discountAmount, discountReason, notes, manufacturerName, vendorOrderId, useInventory, inventoryQtyUsed]
    AdminOrderAddress:
      type: object
      properties:
        id: { type: integer }
        recipientName: { type: string, nullable: true }
        street1: { type: string }
        street2: { type: string, nullable: true }
        city: { type: string }
        state: { type: string }
        zip: { type: string }
        country: { type: string }
        phone: { type: string, nullable: true }
      required: [id, street1, city, state, zip, country]
    AdminOrderStatusEvent:
      type: object
      properties:
        id: { type: integer }
        fromStatus: { type: string, nullable: true }
        toStatus: { type: string }
