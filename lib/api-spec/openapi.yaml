                items: { $ref: "#/components/schemas/AdminDiscountEvent" }
    post:
      operationId: adminCreateDiscountEvent
      tags: [admin-discounts]
      summary: Create a new discount event
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDiscountEventRequest" }
      responses:
        "201":
          description: Created
          content: { application/json: { schema: { $ref: "#/components/schemas/AdminDiscountEvent" } } }
        "400":
          description: Validation error
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /admin/discount-events/{id}:
    put:
      operationId: adminUpdateDiscountEvent
      tags: [admin-discounts]
      summary: Update a discount event
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateDiscountEventRequest" }
      responses:
        "200":
          description: Updated
          content: { application/json: { schema: { $ref: "#/components/schemas/AdminDiscountEvent" } } }
        "400":
          description: Validation error
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: Not found
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    delete:
      operationId: adminDeleteDiscountEvent
      tags: [admin-discounts]
      summary: Delete a discount event
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted }
        "404":
          description: Not found
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /admin/coupon-codes:
    get:
      operationId: adminListCouponCodes
      tags: [admin-discounts]
      summary: List all coupon codes
      responses:
        "200":
          description: All coupons, active first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminCouponCode" }
    post:
      operationId: adminCreateCouponCode
      tags: [admin-discounts]
      summary: Create a new coupon code
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCouponCodeRequest" }
      responses:
        "201":
          description: Created
          content: { application/json: { schema: { $ref: "#/components/schemas/AdminCouponCode" } } }
        "400":
          description: Validation error
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: Code already exists
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /admin/coupon-codes/{id}:
    put:
      operationId: adminUpdateCouponCode
      tags: [admin-discounts]
      summary: Update a coupon code
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCouponCodeRequest" }
      responses:
        "200":
          description: Updated
          content: { application/json: { schema: { $ref: "#/components/schemas/AdminCouponCode" } } }
        "400":
          description: Validation error
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: Not found
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: Code already exists
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    delete:
      operationId: adminDeleteCouponCode
      tags: [admin-discounts]
      summary: Delete a coupon code
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted }
        "404":
          description: Not found
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /admin/coupon-codes/{id}/uses:
    get:
      operationId: adminListCouponCodeUses
      tags: [admin-discounts]
      summary: List redemptions of a coupon code
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: All uses, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminCouponCodeUse" }
        "404":
          description: Coupon not found
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /admin/settings:
    get:
      operationId: adminGetSettings
      tags: [admin-settings]
      summary: Read all system settings as a typed object
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemSettings" }
    put:
      operationId: adminUpdateSettings
      tags: [admin-settings]
      summary: Bulk update one or more system settings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SystemSettingsUpdate" }
      responses:
        "200":
          description: Updated settings
          content: { application/json: { schema: { $ref: "#/components/schemas/SystemSettings" } } }
        "400":
          description: Validation error
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /admin/legal/{type}:
    get:
      operationId: adminListLegalVersions
      tags: [admin-legal]
      summary: List all versions of a legal document type
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [privacy_policy, terms_and_conditions]
      responses:
        "200":
          description: All versions, newest effective date first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminLegalDocument" }
    post:
      operationId: adminCreateLegalVersion
      tags: [admin-legal]
      summary: Publish a new version of a legal document
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [privacy_policy, terms_and_conditions]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateLegalVersionRequest" }
      responses:
        "201":
          description: Newly active version
          content: { application/json: { schema: { $ref: "#/components/schemas/AdminLegalDocument" } } }
        "400":
          description: Validation error
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /admin/legal/{type}/{id}/restore:
    post:
      operationId: adminRestoreLegalVersion
      tags: [admin-legal]
      summary: Restore a prior version as the active one
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [privacy_policy, terms_and_conditions]
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: The restored (now-active) version
          content: { application/json: { schema: { $ref: "#/components/schemas/AdminLegalDocument" } } }
        "404":
          description: Not found
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a presigned URL for uploading a file (staff only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestUploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestUploadUrlResponseSchema"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not staff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    AuditLogEntry:
      type: object
      properties:
        id: { type: integer }
        userId: { type: integer, nullable: true }
        userEmail: { type: string, nullable: true }
        action: { type: string }
        entityType: { type: string, nullable: true }
        entityId: { type: integer, nullable: true }
        changes: {}
        ipAddress: { type: string, nullable: true }
        userAgent: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
      required:
        [id, userId, userEmail, action, entityType, entityId, ipAddress, userAgent, createdAt]
    AuditLogPage:
      type: object
      properties:
        rows:
          type: array
          items: { $ref: "#/components/schemas/AuditLogEntry" }
        total: { type: integer }
      required: [rows, total]
    UpdateOrderStatusRequest:
      type: object
      properties:
        toStatus: { type: string }
        note: { type: string, nullable: true }
      required: [toStatus]
    UpdateOrderNotesRequest:
      type: object
      properties:
        notes: { type: string, nullable: true }
      required: [notes]
    ReviewCancellationRequest:
      type: object
      properties:
        decision: { type: string, enum: [approved, denied] }
        reviewNote: { type: string, nullable: true }
        refundAmount: { type: number, nullable: true }
      required: [decision]
    AdminOrderSummary:
      type: object
      properties:
        id: { type: integer }
        orderNumber: { type: string }
        status: { type: string }
        orderType: { type: string }
        total: { type: number }
        balanceDue: { type: number }
        customerId: { type: integer, nullable: true }
        customerName: { type: string, nullable: true }
        customerEmail: { type: string, nullable: true }
        agentId: { type: integer, nullable: true }
        agentName: { type: string, nullable: true }
        itemCount: { type: integer }
        placedAt: { type: string, format: date-time }
      required:
        [id, orderNumber, status, orderType, total, balanceDue, customerId, customerName, customerEmail, agentId, agentName, itemCount, placedAt]
    AdminOrderPage:
      type: object
      properties:
        rows:
          type: array
          items: { $ref: "#/components/schemas/AdminOrderSummary" }
        total: { type: integer }
      required: [rows, total]
    AdminOrderItem:
      type: object
      properties:
        id: { type: integer }
        productId: { type: integer, nullable: true }
        productSkuSnapshot: { type: string, nullable: true }
        variantSkuSnapshot: { type: string, nullable: true }
        variantNameSnapshot: { type: string, nullable: true }
        fabricNameSnapshot: { type: string, nullable: true }
        department: { type: string, nullable: true }
        description: { type: string }
        quantity: { type: integer }
        unitPrice: { type: number }
        amount: { type: number }
        discountAmount: { type: number }
        discountReason: { type: string, nullable: true }
        notes: { type: string, nullable: true }
