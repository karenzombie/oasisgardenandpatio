      required:
        - pools
        - fabricIds
    AdminUpdateProductFabricsRequest:
      type: object
      properties:
        manufacturerIds:
          type: array
          items: { type: integer }
          description: Replace pools with these manufacturer IDs.
        fabricIds:
          type: array
          items: { type: integer }
          description: Replace individual fabric picks with these fabric IDs.
      required:
        - manufacturerIds
        - fabricIds
    AdminProductAttribute:
      type: object
      properties:
        id: { type: integer }
        attributeType:
          type: string
          enum: [feature, option, replacement_part]
        partName:
          type: ["string", "null"]
          description: Required when attributeType is 'replacement_part', null otherwise.
        value: { type: string }
        displayOrder: { type: integer }
      required:
        - id
        - attributeType
        - partName
        - value
        - displayOrder
    AdminProductAttributeInput:
      type: object
      properties:
        attributeType:
          type: string
          enum: [feature, option, replacement_part]
        partName:
          type: ["string", "null"]
        value:
          type: string
          minLength: 1
        displayOrder: { type: integer }
      required:
        - attributeType
        - value
        - displayOrder
    AdminUpdateProductAttributesRequest:
      type: object
      properties:
        attributes:
          type: array
          items:
            $ref: "#/components/schemas/AdminProductAttributeInput"
      required:
        - attributes
    AdminBulkUpdateProductsFields:
      type: object
      description: Scalar product fields to set on every selected product. Omit a field to leave it unchanged. Use null on FK fields to clear them.
      properties:
        isActive: { type: boolean }
        featured: { type: boolean }
        inStoreOnly: { type: boolean }
        availableOnline: { type: boolean }
        quoteOnly: { type: boolean }
        showPriceOnline: { type: boolean }
        categoryId: { type: ["integer", "null"] }
        manufacturerId: { type: ["integer", "null"] }
        materialId: { type: ["integer", "null"] }
    AdminBulkPriceAdjustment:
      type: object
      description: Apply a flat dollar or percentage change to selected price columns across all chosen products.
      properties:
        fields:
          type: array
          items:
            type: string
            enum: [price, salePrice, cost, msrp, frameOnlyPrice]
          minItems: 1
          description: Which price columns to adjust. Columns that are NULL on a given product are skipped.
        mode:
          type: string
          enum: [flat, percent]
          description: flat = add/subtract a fixed dollar amount; percent = multiply the current value by (1 + amount/100).
        amount:
          type: number
          description: Positive = increase, negative = decrease. For percent mode 5 means +5%, -3 means -3%.
        roundTo:
          type: integer
          description: Decimal places to round adjusted values to (default 2).
      required: [fields, mode, amount]
    AdminBulkFabricPoolsChange:
      type: object
      description: How to mutate each product's fabric-pool manufacturer list.
      properties:
        mode:
          type: string
          enum: [replace, add, remove, clear]
        manufacturerIds:
          type: array
          items: { type: integer }
          description: Required for replace/add/remove; ignored for clear.
      required: [mode]
    AdminBulkFabricPicksChange:
      type: object
      description: How to mutate each product's individual fabric picks.
      properties:
        mode:
          type: string
          enum: [replace, add, remove, clear]
        fabricIds:
          type: array
          items: { type: integer }
          description: Required for replace/add/remove; ignored for clear.
      required: [mode]
    AdminBulkUpdateProductsRequest:
      type: object
      properties:
        productIds:
          type: array
          items: { type: integer }
          minItems: 1
          maxItems: 500
        fields:
          $ref: "#/components/schemas/AdminBulkUpdateProductsFields"
        fabricPools:
          $ref: "#/components/schemas/AdminBulkFabricPoolsChange"
        fabricPicks:
          $ref: "#/components/schemas/AdminBulkFabricPicksChange"
        priceAdjustments:
          $ref: "#/components/schemas/AdminBulkPriceAdjustment"
      required: [productIds]
    AdminBulkUpdateProductsResult:
      type: object
      properties:
        productsUpdated:
          type: integer
          description: How many products had their scalar fields changed.
        fabricsUpdated:
          type: integer
          description: How many products had their fabric pools or picks changed.
        pricesUpdated:
          type: integer
          description: How many products had at least one price field adjusted.
        notFound:
          type: array
          items: { type: integer }
          description: Product IDs that did not exist and were skipped.
      required: [productsUpdated, fabricsUpdated, pricesUpdated, notFound]
    EntityHistoryEntry:
      type: object
      properties:
        id: { type: integer, format: int64 }
        entityType: { type: string }
        entityId: { type: integer }
        changeType:
          type: string
          enum: [create, update, delete, replace]
        snapshot: {}
        previousSnapshot: {}
        changedByUserId: { type: ["integer", "null"] }
        changedByEmail: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
      required:
        - id
        - entityType
        - entityId
        - changeType
        - snapshot
        - previousSnapshot
        - changedByUserId
        - changedByEmail
        - notes
        - createdAt
