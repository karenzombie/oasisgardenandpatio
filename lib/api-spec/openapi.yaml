openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Oasis Garden & Patio API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: legal
    description: Legal document operations
  - name: banners
    description: Site notifications
  - name: manufacturers
    description: Manufacturers
  - name: categories
    description: Product categories
  - name: products
    description: Products
  - name: auth
    description: Authentication and account management
  - name: staff-auth
    description: Staff (agent / admin) authentication, 2FA, and password change
  - name: storage
    description: File upload and object storage
  - name: admin-manufacturers
    description: Admin CRUD for manufacturers
  - name: admin-categories
    description: Admin CRUD for product categories
  - name: admin-wishlists
    description: Staff view of customer wishlists (Brief 7)
  - name: cushions
    description: Custom cushion orders created by staff on behalf of customers
  - name: analytics
    description: Visitor / funnel analytics ingestion (public) and reporting (admin)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /legal/{type}:
    get:
      operationId: getLegalDocument
      tags: [legal]
      summary: Get the currently active legal document for a given type
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [privacy_policy, terms_and_conditions, shipping_returns, warranty]
      responses:
        "200":
          description: The active legal document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalDocument"
        "404":
          description: No active document found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /banners/active:
    get:
      operationId: listActiveBanners
      tags: [banners]
      summary: List currently active site-wide banners
      responses:
        "200":
          description: Active banners
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Banner"
  /manufacturers:
    get:
      operationId: listManufacturers
      tags: [manufacturers]
      summary: List active manufacturers
      parameters:
        - in: query
          name: onlineOnly
          schema:
            type: boolean
          description: When true, only return manufacturers that have at least one directly purchasable online product (excludes quote-only and in-store-only products)
      responses:
        "200":
          description: Active manufacturers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Manufacturer"
  /materials:
    get:
      operationId: listMaterials
      tags: [materials]
      summary: List active materials
      responses:
        "200":
          description: Active materials
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Material"
  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List active categories
      parameters:
        - in: query
          name: onlineOnly
          schema:
            type: boolean
          description: When true, only return categories that have at least one directly purchasable online product (excludes quote-only and in-store-only products)
      responses:
        "200":
          description: Active categories (top-level and nested)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
  /products/featured:
    get:
      operationId: listFeaturedProducts
      tags: [products]
      summary: Featured products for the homepage
      responses:
        "200":
          description: Featured products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeaturedProduct"
  /products/{sku}/recommendations:
    get:
      operationId: listProductRecommendations
      tags: [products]
      summary: Compatible product recommendations for a product SKU
      description: >-
        Returns items compatible with the given product SKU. Only items whose
        product is active and available for online purchase are returned; the
        recommended pick is sorted first. Empty array when nothing qualifies.
      parameters:
        - name: sku
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Compatible recommendations (online-available only)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductRecommendation"
  /products:
    get:
      operationId: listCatalogProducts
      tags: [products]
      summary: Public product listing with filters, sort, and pagination
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: categorySlug
          in: query
          required: false
          description: One or more category slugs, comma-separated for multi-select (OR'd together, e.g. "umbrellas,bases").
          schema:
            type: string
        - name: manufacturerSlug
          in: query
          required: false
          description: One or more manufacturer slugs, comma-separated for multi-select (OR'd together).
          schema:
            type: string
        - name: materialSlug
          in: query
          required: false
          description: One or more material slugs, comma-separated for multi-select (OR'd together).
          schema:
            type: string
        - name: collection
          in: query
          required: false
          description: One or more product collection names (exact match), comma-separated for multi-select (OR'd together). Typically used together with manufacturerSlug.
          schema:
            type: string
        - name: subCategory
          in: query
          required: false
          description: One or more product sub-category names (exact match), comma-separated for multi-select (OR'd together). Typically used together with categorySlug.
          schema:
            type: string
        - name: sizeLabel
          in: query
          required: false
          description: One or more umbrella canopy size labels, comma-separated for multi-select (OR'd together).
          schema:
            type: string
        - name: onlineOnly
          in: query
          required: false
          description: When true, exclude quote-only products (show only items purchasable online)
          schema:
            type: boolean
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [featured, newest, price_asc, price_desc, name_asc]
            default: featured
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 60
            default: 12
      responses:
        "200":
          description: Paginated catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogProductsPage"
  /catalog/collections:
    get:
      operationId: listCatalogCollections
      tags: [products]
      summary: Distinct product collection names, optionally scoped to a manufacturer
      parameters:
        - name: manufacturerSlug
          in: query
          required: false
          description: Limit collections to a single manufacturer (recommended; the global set is very large)
          schema:
            type: string
      responses:
        "200":
          description: List of collection names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /catalog/facets:
    get:
      operationId: listCatalogFacets
      tags: [products]
      summary: Available filter facets (category, sub-category, brand, material, collection) for the current filter combination
      description: >-
        Returns the set of filter options that yield at least one product given the OTHER active
        filters. Each facet is computed by applying every active filter EXCEPT its own selection, so
        the user can still switch between values within a facet while zero-result options stay hidden.
        Options are derived live from catalog data, so they adapt automatically as products change.
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: categorySlug
          in: query
          required: false
          description: One or more category slugs, comma-separated for multi-select (OR'd together).
          schema:
            type: string
        - name: manufacturerSlug
          in: query
          required: false
          description: One or more manufacturer slugs, comma-separated for multi-select (OR'd together).
          schema:
            type: string
        - name: materialSlug
          in: query
          required: false
          description: One or more material slugs, comma-separated for multi-select (OR'd together).
          schema:
            type: string
        - name: collection
          in: query
          required: false
          description: One or more product collection names, comma-separated for multi-select (OR'd together).
          schema:
            type: string
        - name: subCategory
          in: query
          required: false
          description: One or more product sub-category names, comma-separated for multi-select (OR'd together).
          schema:
            type: string
        - name: sizeLabel
          in: query
          required: false
          description: One or more umbrella canopy size labels, comma-separated for multi-select (OR'd together).
          schema:
            type: string
        - name: onlineOnly
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Available filter facets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogFacets"
  /catalog/fabrics:
    get:
      operationId: listCatalogFabrics
      tags: [products]
      summary: Public list of all active fabrics offered as product options
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Filter fabrics by name or item number (case-insensitive substring match)
        - name: colorFamily
          in: query
          required: false
          schema:
            type: string
          description: Filter to fabrics with this color family (case-insensitive exact match)
      responses:
        "200":
          description: Active fabrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogFabricsResponse"
  /catalog/manufacturer-finishes:
    get:
      operationId: listCatalogManufacturerFinishes
      tags: [products]
      summary: Public list of all active manufacturer finishes offered as product options
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Filter finishes by name or item number (case-insensitive substring match)
      responses:
        "200":
          description: Active finishes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogFinishesResponse"
  /catalog/manufacturer-finishes/{id}/products:
    get:
      operationId: listCatalogFinishProducts
      tags: [products]
      summary: Public list of products that offer the given finish as an option
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Products using this finish
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogFinishProductsResponse"
        "404":
          description: Finish not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /products/by-slug/{slug}:
    get:
      operationId: getCatalogProductBySlug
      tags: [products]
      summary: Public product detail page payload
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogProductDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /account/addresses:
    get:
      operationId: listAccountAddresses
      tags: [account]
      summary: List the signed-in customer's saved addresses
      responses:
        "200":
          description: Addresses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountAddressesResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createAccountAddress
      tags: [account]
      summary: Save a new address to the signed-in customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountAddressInput"
      responses:
        "200":
          description: Updated addresses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountAddressesResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /account/addresses/{addressId}:
    patch:
      operationId: updateAccountAddress
      tags: [account]
      summary: Update one of the signed-in customer's saved addresses
      parameters:
        - name: addressId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountAddressInput"
      responses:
        "200":
          description: Updated addresses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountAddressesResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Address not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteAccountAddress
      tags: [account]
      summary: Delete one of the signed-in customer's saved addresses
      parameters:
        - name: addressId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated addresses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountAddressesResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Address not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /account/profile:
    get:
      operationId: getAccountProfile
      tags: [account]
      summary: Get the signed-in customer's profile, email status, and role addresses
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountProfileResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: updateAccountProfile
      tags: [account]
      summary: Update the signed-in customer's name and phone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountProfileInput"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountProfileResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /account/marketing-preference:
    put:
      operationId: updateAccountMarketingPreference
      tags: [account]
      summary: Update the signed-in customer's marketing contact preference (wishlist follow-ups + promotional emails only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMarketingPreferenceBody"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountProfileResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /account/marketing-preference/opt-out:
    post:
      operationId: optOutMarketingPreference
      tags: [account]
      summary: Validate a signed wishlist-email opt-out token and mark the customer opted out. Public endpoint -- no auth, reached from an email link.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketingOptOutBody"
      responses:
        "200":
          description: Token processed (valid or invalid/expired -- see status)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketingOptOutResponse"
  /account/addresses/role/{role}:
    put:
      operationId: upsertAccountRoleAddress
      tags: [account]
      summary: Create or update the signed-in customer's default billing or shipping address
      parameters:
        - name: role
          in: path
          required: true
          schema:
            type: string
            enum: [billing, shipping]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountAddressInput"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountProfileResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /account/email-change:
    post:
      operationId: requestAccountEmailChange
      tags: [account]
      summary: Request an email change; sends a verification code to the new address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestEmailChangeBody"
      responses:
        "200":
          description: Code sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestEmailChangeResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: cancelAccountEmailChange
      tags: [account]
      summary: Cancel a pending email change
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountProfileResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /account/email-change/verify:
    post:
      operationId: verifyAccountEmailChange
      tags: [account]
      summary: Verify the email change code and apply the new email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailChangeBody"
      responses:
        "200":
          description: Email updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountProfileResponse"
        "400":
          description: Invalid or expired code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /account/orders:
    get:
      operationId: listAccountOrders
      tags: [account]
      summary: List the signed-in customer's orders
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountOrdersResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /account/orders/{orderNumber}:
    get:
      operationId: getAccountOrder
      tags: [account]
      summary: Get a single order belonging to the signed-in customer
      parameters:
        - name: orderNumber
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountOrderDetail"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /checkout/quote:
    post:
      operationId: quoteCheckout
      tags: [checkout]
      summary: Compute shipping + tax for the signed-in customer's cart
      description: >-
        Returns the live shipping cost and sales tax for the current cart based
        on a destination state. Used by the checkout page to show realistic
        totals before the order is placed. The quote is informational: the
        server re-computes the same values when the order is actually placed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutQuoteRequest"
      responses:
        "200":
          description: Quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutQuoteResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /checkout:
    post:
      operationId: placeOrder
      tags: [checkout]
      summary: Place an order from the signed-in customer's cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaceOrderRequest"
      responses:
        "200":
          description: Order placed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaceOrderResult"
        "400":
          description: Invalid request or empty cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /wishlist:
    get:
      operationId: getWishlist
      tags: [wishlist]
      summary: List wishlist items for the signed-in user or a guest device
      description: >-
        For signed-in users, returns rows owned by the session user. For
        guests, pass `deviceToken` as a query parameter to return that
        device's saved rows (user_id IS NULL).
      parameters:
        - name: deviceToken
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Wishlist items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WishlistResponse"
    post:
      operationId: addWishlistItem
      tags: [wishlist]
      summary: Add a product (with optional configuration) to a wishlist
      description: >-
        For signed-in users, the row is owned by the session user and
        multiple configurations of the same product are allowed. For guests,
        `deviceToken` identifies the device; only one row per product is
        allowed per device (enforced by a partial unique constraint).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddWishlistItemRequest"
      responses:
        "200":
          description: Wishlist after add
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WishlistResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            Guest already has a saved configuration for this product. The
            client should prompt the guest to sign in, create an account, or
            replace the existing configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/shipping/rules:
    get:
      operationId: adminListShippingRules
      tags: [admin-shipping]
      summary: List all shipping rate rules (areas A–D)
      responses:
        "200":
          description: Shipping rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShippingRuleListResponse"
    post:
      operationId: adminCreateShippingRule
      tags: [admin-shipping]
      summary: Create a shipping rate rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShippingRuleRequest"
      responses:
        "201":
          description: Created rule, with any SKUs that already had a rule (overlap)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateShippingRuleResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
