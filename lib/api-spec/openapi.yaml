    ReceiveVendorOrderRequest:
      type: object
      properties:
        items:
          type: array
          minItems: 1
          description: "Per-line quantities being received in this event. Each entry must reference an item currently on this vendor order."
          items:
            type: object
            properties:
              orderItemId: { type: integer }
              quantity: { type: integer, minimum: 1 }
            required: [orderItemId, quantity]
        notes: { type: string, nullable: true }
      required: [items]
    CancelVendorOrderRequest:
      type: object
      description: |
        Cancel a vendor order in full or partially. For 'full' scope all
        items are un-assigned and the PO status moves to 'canceled'. For
        'partial' scope only the listed itemIds are un-assigned; the PO
        status is preserved. A cancellation PDF is generated and stored
        regardless; if sendEmail is true it is also emailed to the vendor.
      properties:
        scope:
          type: string
          enum: [full, partial]
        itemIds:
          type: array
          items: { type: integer }
          description: Required when scope=partial. Must reference items currently on this vendor order.
        reason:
          type: string
          nullable: true
        sendEmail:
          type: boolean
          description: When true, email the cancellation PDF to the vendor. Defaults to false.
        sentToEmail:
          type: string
          nullable: true
          description: Override the recipient address. Falls back to the manufacturer's order email.
      required: [scope]
    AdminVendorOrderCancellation:
      type: object
      properties:
        id: { type: integer }
        scope: { type: string, enum: [full, partial] }
        reason: { type: string, nullable: true }
        cancelledByUserId: { type: integer, nullable: true }
        cancelledByEmail: { type: string, nullable: true }
        cancelledAt: { type: string, format: date-time }
        pdfStorageUrl: { type: string, nullable: true }
        emailedAt: { type: string, format: date-time, nullable: true }
        emailedTo: { type: string, nullable: true }
        itemCount: { type: integer }
      required:
        [id, scope, reason, cancelledByUserId, cancelledByEmail, cancelledAt, pdfStorageUrl, emailedAt, emailedTo, itemCount]
    AdminVendorOrderReceive:
      type: object
      properties:
        id: { type: integer }
        receivedByUserId: { type: integer, nullable: true }
        receivedByEmail: { type: string, nullable: true }
        receivedAt: { type: string, format: date-time }
        notes: { type: string, nullable: true }
        items:
          type: array
          items:
            type: object
            properties:
              orderItemId: { type: integer }
              sku: { type: string, nullable: true }
              description: { type: string }
              quantityReceived: { type: integer }
            required: [orderItemId, sku, description, quantityReceived]
      required: [id, receivedByUserId, receivedByEmail, receivedAt, notes, items]
    CancelPendingVendorOrderRequest:
      type: object
      description: |
        Cancel a pending (unsent) vendor order. No PDF is generated and no vendor notification is sent.
        For 'full' scope, all items are un-assigned and the PO status moves to 'canceled'.
        For 'partial' scope, only the selected items are un-assigned; the PO stays 'pending'.
      properties:
        scope:
          type: string
          enum: [full, partial]
        itemIds:
          type: array
          items: { type: integer }
          description: Required when scope=partial.
        reason: { type: string, nullable: true }
      required: [scope]
