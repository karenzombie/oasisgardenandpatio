  /admin/vendor-orders/{id}/cancel:
    post:
      operationId: adminCancelVendorOrder
      tags: [admin-vendor-orders]
      summary: Cancel a vendor order (un-assigns its items so they can be reassigned)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: false
