        useInventory: { type: boolean, default: false, description: "When true, units are sourced from store inventory at order creation. Vendor order only covers the balance beyond what is on hand." }
        parentItemIndex:
          type: ["integer", "null"]
          description: "Zero-based index (within this request's items array) of the base line this accessory line is tied to. Used to set parent_order_item_id on Aluminum Top Cover lines so they group under their base. Null for independent lines (including stems)."
