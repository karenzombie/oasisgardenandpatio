  /wishlist/merge:
    post:
      operationId: mergeWishlist
      tags: [wishlist]
      summary: Merge a guest device's wishlist into the signed-in user's wishlist
      description: >-
        Called automatically by the auth success handler immediately after
        sign-in or account creation. Reassigns all guest rows for the given
        `deviceToken` (user_id IS NULL) to the session user, skipping any row
        whose product + configuration already exists for that user. Returns
        the user's full merged wishlist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergeWishlistRequest"
      responses:
        "200":
          description: Wishlist after merge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WishlistResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /wishlist/{id}:
    delete:
      operationId: removeWishlistItem
      tags: [wishlist]
      summary: Remove a wishlist item by its row id
      description: >-
        For signed-in users the row must belong to the session user. For
        guests, pass `deviceToken` in the request body and the row's
        device_token must match.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoveWishlistItemRequest"
      responses:
        "200":
          description: Wishlist after removal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WishlistResponse"
        "404":
          description: Wishlist item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
