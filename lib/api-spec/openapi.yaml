components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    AuditLogEntry:
      type: object
      properties:
        id: { type: integer }
        userId: { type: integer, nullable: true }
        userEmail: { type: string, nullable: true }
        action: { type: string }
        entityType: { type: string, nullable: true }
        entityId: { type: integer, nullable: true }
        changes: {}
        ipAddress: { type: string, nullable: true }
        userAgent: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
      required:
        [id, userId, userEmail, action, entityType, entityId, ipAddress, userAgent, createdAt]
    AuditLogPage:
      type: object
      properties:
        rows:
          type: array
          items: { $ref: "#/components/schemas/AuditLogEntry" }
        total: { type: integer }
      required: [rows, total]
    AdminRefundOrderRequest:
      type: object
      properties:
        grossRefundAmount: { type: number, description: "Full refund amount before any restocking fee" }
        restockingFeeType: { type: string, enum: [flat, percent], nullable: true }
        restockingFeeValue: { type: number, nullable: true, description: "Flat dollar amount, or percentage 0-100" }
        note: { type: string, nullable: true }
      required: [grossRefundAmount]
    UpdateOrderStatusRequest:
      type: object
      properties:
        toStatus: { type: string }
        note: { type: string, nullable: true }
      required: [toStatus]
    UpdateOrderNotesRequest:
      type: object
      properties:
        notes: { type: string, nullable: true }
      required: [notes]
    ReviewCancellationRequest:
      type: object
      properties:
        decision: { type: string, enum: [approved, denied] }
        reviewNote: { type: string, nullable: true }
        refundAmount: { type: number, nullable: true }
      required: [decision]
    AdminOrderSummary:
      type: object
      properties:
        id: { type: integer }
        orderNumber: { type: string }
        status: { type: string }
        orderType: { type: string }
        total: { type: number }
        balanceDue: { type: number }
        customerId: { type: integer, nullable: true }
