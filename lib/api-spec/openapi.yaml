openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Oasis Garden & Patio API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: legal
    description: Legal document operations
  - name: banners
    description: Site notifications
  - name: manufacturers
    description: Manufacturers
  - name: categories
    description: Product categories
  - name: products
    description: Products
  - name: auth
    description: Authentication and account management
  - name: staff-auth
    description: Staff (agent / admin) authentication, 2FA, and password change
  - name: storage
    description: File upload and object storage
  - name: admin-manufacturers
    description: Admin CRUD for manufacturers
  - name: admin-categories
    description: Admin CRUD for product categories
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /legal/{type}:
    get:
      operationId: getLegalDocument
      tags: [legal]
      summary: Get the currently active legal document for a given type
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [privacy_policy, terms_and_conditions]
      responses:
        "200":
          description: The active legal document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalDocument"
        "404":
          description: No active document found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /banners/active:
    get:
      operationId: listActiveBanners
      tags: [banners]
      summary: List currently active site-wide banners
      responses:
        "200":
          description: Active banners
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Banner"
  /manufacturers:
    get:
      operationId: listManufacturers
      tags: [manufacturers]
      summary: List active manufacturers
      responses:
        "200":
          description: Active manufacturers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Manufacturer"
  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List active categories
      responses:
        "200":
          description: Active categories (top-level and nested)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
  /products/featured:
    get:
      operationId: listFeaturedProducts
      tags: [products]
      summary: Featured products for the homepage
      responses:
        "200":
          description: Featured products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeaturedProduct"
  /auth/signup:
    post:
      operationId: signup
      tags: [auth]
      summary: Create a new customer account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "201":
          description: Account created and logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      responses:
        "204":
          description: Session ended
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the currently authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/verify-email:
    post:
      operationId: verifyEmail
      tags: [auth]
      summary: Verify an email address using a token from the verification email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
      responses:
        "200":
          description: Email verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "400":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/resend-verification:
    post:
      operationId: resendVerification
      tags: [auth]
      summary: Resend the verification email for the current user
      responses:
        "204":
          description: Verification email sent (or skipped if already verified)
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/request-password-reset:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      summary: Send a password reset email if the address is registered
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestPasswordResetRequest"
      responses:
        "204":
          description: Always returns success (does not disclose whether the email exists)
  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Reset a password using a token from the reset email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: Password updated
        "400":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/staff/login:
    post:
      operationId: staffLogin
      tags: [staff-auth]
      summary: Begin staff login (email + password). Returns the next stage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffLoginRequest"
      responses:
        "200":
          description: Login accepted; returns next required stage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffStageResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/staff/state:
    get:
      operationId: staffGetState
      tags: [staff-auth]
      summary: Get current staff session stage
      responses:
        "200":
          description: Current stage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffStageResponse"
        "401":
          description: Not in any staff session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffStageResponse"
  /auth/staff/2fa/setup-init:
    post:
      operationId: staffSetupTotp
      tags: [staff-auth]
      summary: Generate a new TOTP secret for first-time enrollment
      responses:
        "200":
          description: QR code and manual entry key for an authenticator app
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpSetupInitResponse"
        "400":
          description: Not in setup stage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/staff/2fa/setup-verify:
    post:
      operationId: staffVerifySetupTotp
      tags: [staff-auth]
      summary: Confirm TOTP enrollment with the first 6-digit code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpCodeRequest"
      responses:
        "200":
          description: Enrollment complete; returns recovery codes (shown once)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffStageResponse"
        "400":
          description: Invalid code or not in setup stage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/staff/2fa/verify:
    post:
      operationId: staffVerifyTotp
      tags: [staff-auth]
      summary: Verify TOTP code for an already-enrolled user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpCodeRequest"
      responses:
        "200":
          description: Code verified; returns next stage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffStageResponse"
        "400":
          description: Invalid code or not in verify stage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/staff/2fa/recovery:
    post:
      operationId: staffVerifyRecoveryCode
      tags: [staff-auth]
      summary: Use a one-time recovery code instead of a TOTP code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoveryCodeRequest"
      responses:
        "200":
          description: Recovery code consumed; returns next stage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffStageResponse"
        "400":
          description: Invalid recovery code or not in verify stage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/staff/change-password:
    post:
      operationId: staffChangePassword
      tags: [staff-auth]
      summary: Change the current staff user's password (also clears must_change_password)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password changed; returns next stage (usually complete)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffStageResponse"
        "400":
          description: Invalid current password or weak new password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/staff/2fa/disable:
    post:
      operationId: staffDisableTotp
      tags: [staff-auth]
      summary: Disable TOTP for the current admin (admins only)
      responses:
        "200":
          description: TOTP disabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: [ok]
        "403":
          description: Only admins may disable their own 2FA
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/manufacturers:
    get:
      operationId: adminListManufacturers
      tags: [admin-manufacturers]
      summary: List all manufacturers (active and inactive) for admin
      responses:
        "200":
          description: All manufacturers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminManufacturer"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: adminCreateManufacturer
      tags: [admin-manufacturers]
      summary: Create a new manufacturer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateManufacturerRequest"
      responses:
        "201":
          description: Manufacturer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminManufacturer"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Duplicate slug
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/manufacturers/{id}:
    put:
      operationId: adminUpdateManufacturer
      tags: [admin-manufacturers]
      summary: Update a manufacturer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateManufacturerRequest"
      responses:
        "200":
          description: Manufacturer updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminManufacturer"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Duplicate slug
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/manufacturers/{id}/active:
    patch:
      operationId: adminSetManufacturerActive
      tags: [admin-manufacturers]
      summary: Activate or deactivate a manufacturer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetActiveRequest"
      responses:
        "200":
          description: Updated manufacturer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminManufacturer"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/categories:
    get:
      operationId: adminListCategories
      tags: [admin-categories]
      summary: List all categories (active and inactive)
      responses:
        "200":
          description: All categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminCategory"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: adminCreateCategory
      tags: [admin-categories]
      summary: Create a new category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryRequest"
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCategory"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Duplicate slug
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/categories/{id}:
    put:
      operationId: adminUpdateCategory
      tags: [admin-categories]
      summary: Update a category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCategoryRequest"
      responses:
        "200":
          description: Category updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCategory"
        "400":
          description: Validation error (e.g. cycle in parent chain)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Duplicate slug
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/categories/{id}/active:
    patch:
      operationId: adminSetCategoryActive
      tags: [admin-categories]
      summary: Activate or deactivate a category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetActiveRequest"
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCategory"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/products:
    get:
      operationId: adminListProducts
      tags: [admin-products]
      summary: List products with filters and pagination
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: manufacturerId
          in: query
          required: false
          schema:
            type: integer
        - name: categoryId
          in: query
          required: false
          schema:
            type: integer
        - name: isActive
          in: query
          required: false
          schema:
            type: boolean
        - name: featured
          in: query
          required: false
          schema:
            type: boolean
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Paginated products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProductsPage"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: adminCreateProduct
      tags: [admin-products]
      summary: Create a new product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProduct"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Duplicate slug or SKU
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/products/{id}:
    get:
      operationId: adminGetProduct
      tags: [admin-products]
      summary: Get a product with images and inventory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProductDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: adminUpdateProduct
      tags: [admin-products]
      summary: Update a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductRequest"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProduct"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Duplicate slug or SKU
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/products/{id}/active:
    patch:
      operationId: adminSetProductActive
      tags: [admin-products]
      summary: Activate or deactivate a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetActiveRequest"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProduct"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/products/{id}/images:
    post:
      operationId: adminAddProductImage
      tags: [admin-products]
      summary: Attach an image to a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddProductImageRequest"
      responses:
        "201":
          description: Image added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProductImage"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/products/{id}/images/order:
    put:
      operationId: adminReorderProductImages
      tags: [admin-products]
      summary: Reorder product images and set primary
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderProductImagesRequest"
      responses:
        "200":
          description: Updated images in order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminProductImage"
        "400":
          description: Image ids do not all belong to product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/products/{id}/images/{imageId}:
    delete:
      operationId: adminDeleteProductImage
      tags: [admin-products]
      summary: Delete a product image
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: imageId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/products/{id}/inventory:
    put:
      operationId: adminUpdateProductInventory
      tags: [admin-products]
      summary: Set on-hand and reorder threshold for a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInventoryRequest"
      responses:
        "200":
          description: Updated inventory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProductInventory"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/products/import/dry-run:
    post:
      operationId: adminImportProductsDryRun
      tags: [admin-products]
      summary: Validate a CSV import without writing changes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportProductsRequest"
      responses:
        "200":
          description: Dry-run validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportProductsDryRunResult"
        "400":
          description: Validation error (e.g. CSV unparseable, required mapping missing)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/products/import/commit:
    post:
      operationId: adminImportProductsCommit
      tags: [admin-products]
      summary: Commit a CSV import (creates or updates products by SKU)
      requestBody:
        required: true
        content:
          application/json:
