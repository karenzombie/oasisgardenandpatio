        amount: { type: number }
        notes: { type: string, nullable: true }
        sku:
          type: string
          nullable: true
          description: "Effective SKU shown on the PO (PO override if edited, else the variant/product snapshot SKU)."
        subDescription:
          type: string
          nullable: true
          description: "Effective sub-description / variant line (PO override if edited, else the variant/fabric snapshot line)."
