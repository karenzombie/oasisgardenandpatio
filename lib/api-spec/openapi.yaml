          application/json:
            schema: { $ref: "#/components/schemas/ReceiveVendorOrderRequest" }
      responses:
        "200":
          description: Updated vendor order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminVendorOrderDetail" }
