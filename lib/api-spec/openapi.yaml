        - url
        - altText
        - isPrimary
        - displayOrder
        - imageKind
        - finishId
    CatalogProductVariant:
      type: object
      properties:
        id:
          type: integer
        sku:
          type: string
        name:
          type: string
        optionLabel:
          type: string
          description: Group label for this set of variants (e.g. "Frame Finish").
        priceAdjustment:
          type: string
          description: Decimal added to the base price when this variant is selected.
        msrp:
          type: ["string", "null"]
          description: Absolute per-variant MSRP. When set together with salePrice, overrides the product base price + priceAdjustment for this variant (e.g. per-size rug pricing).
        salePrice:
          type: ["string", "null"]
          description: Absolute per-variant sale price. When set together with msrp, drives the displayed and line price for this variant.
        shippingSurcharge:
          type: string
          description: Flat per-unit shipping surcharge for this variant in dollars (e.g. oversize "truck only" freight). "0" when none.
        weight:
          type: ["string", "null"]
          description: Per-variant shipping weight in lbs (e.g. per-size rug weight). Null falls back to the product-level weight.
        dimensions:
          type: ["string", "null"]
          description: Per-variant dimensions/spec string (e.g. per-size umbrella clearances). Null falls back to the product-level dimensions.
        displayOrder:
          type: integer
        swatchImageUrl:
          type: ["string", "null"]
          description: Public URL of the matching finish swatch image, if one exists for this finish name.
        collection:
          type: ["string", "null"]
          description: Collection name from the finish row, if set (Couture Jardin only). Used to group variants by collection on the product page.
        gradePrices:
          type: array
          description: Per-fabric-grade MSRP + sale price for this configuration. Non-empty only for grade-priced products (e.g. Frankford). When present, the product page is in 3-step grade mode and the selected fabric's grade picks the price row.
          items:
            $ref: "#/components/schemas/CatalogVariantGradePrice"
        notes:
          type: ["string", "null"]
          description: Free-text vendor note for this configuration (e.g. extended lead times), shown as an inline callout. Excludes structured min-order-qty / stripe rules.
        minOrderQty:
          type: ["integer", "null"]
          description: Minimum order quantity for this configuration. When set, the quantity selector floors at this value.
        excludeStripeFabrics:
          type: boolean
          description: When true, stripe-pattern fabrics are not selectable for this configuration.
      required:
        - id
        - sku
        - name
        - optionLabel
        - priceAdjustment
        - msrp
        - salePrice
        - shippingSurcharge
        - weight
        - dimensions
        - displayOrder
        - swatchImageUrl
        - collection
        - gradePrices
        - notes
        - minOrderQty
        - excludeStripeFabrics
    CatalogVariantGradePrice:
      type: object
      properties:
        grade:
          type: string
          description: Fabric grade (e.g. "A", "A+", "B", "C", "D", "E", "F").
        msrp:
          type: string
          description: Decimal MSRP for this configuration at this grade.
        salePrice:
          type: string
          description: Decimal sale price for this configuration at this grade.
      required:
        - grade
        - msrp
        - salePrice
    CatalogAddonOption:
      type: object
      description: >-
        An optional add-on (e.g. privacy walls, replacement stem) for a
        configurable product. Priced additively on top of the base product.
        per_grade add-ons resolve their price from the selected canopy fabric's
        grade; flat add-ons use flatMsrp/flatSalePrice.
      properties:
        id:
          type: integer
        sku:
          type: string
        name:
          type: string
        description:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
          description: Public URL of the add-on selector image, if any.
        pricingMode:
          type: string
          enum: [per_grade, flat]
        flatMsrp:
          type: ["string", "null"]
          description: Decimal MSRP for flat-priced add-ons. Null for per_grade add-ons.
        flatSalePrice:
          type: ["string", "null"]
          description: Decimal sale price for flat-priced add-ons. Null for per_grade add-ons.
        triggersPairing:
          type: boolean
          description: When true, selecting this add-on forces the pairing-target add-on to be added too (e.g. a wall requires the half curtains).
        isPairingTarget:
          type: boolean
          description: When true, this add-on is auto-added and required whenever any triggersPairing add-on is selected.
        enabled:
          type: boolean
        displayOrder:
          type: integer
        gradePrices:
          type: array
          description: Per-fabric-grade MSRP + sale price. Non-empty only when pricingMode is per_grade; the selected canopy fabric's grade picks the row.
          items:
            $ref: "#/components/schemas/CatalogVariantGradePrice"
      required:
        - id
        - sku
        - name
        - description
        - imageUrl
        - pricingMode
        - flatMsrp
        - flatSalePrice
        - triggersPairing
        - isPairingTarget
        - enabled
        - displayOrder
        - gradePrices
    CatalogFinishOption:
      type: object
      description: A discrete frame-finish choice for a grade-priced product (resolved from the product's finish pool/options).
      properties:
        id:
          type: integer
        code:
          type: string
          description: Short finish code (e.g. "SR", "MS").
        name:
          type: string
          description: Display name (e.g. "Platinum", "Brushed Silver").
        description:
          type: ["string", "null"]
          description: >-
            Finish category, used to distinguish frame finishes from
            table-top tiles (e.g. "Frame Finish", "Table Top Tile").
        swatchImageUrl:
          type: ["string", "null"]
        displayOrder:
          type: integer
        upchargeMsrp:
          type: string
          description: Decimal MSRP frame upcharge added when this finish is selected ("0" for no upcharge).
        upchargeSale:
          type: string
          description: Decimal customer-facing (discounted) frame upcharge for this finish ("0" for no upcharge).
        minOrderQty:
          type: ["integer", "null"]
          description: Minimum order quantity enforced when this finish is selected (e.g. special-order finishes). Null means no finish-driven minimum.
        collection:
          type: ["string", "null"]
          description: >-
            Finish collection name from the finish row (e.g. "Woven Finishes").
            Used to identify woven-finish options for the Frame + Weave Color picker.
      required:
        - id
        - code
        - name
        - description
        - swatchImageUrl
        - displayOrder
        - upchargeMsrp
        - upchargeSale
        - minOrderQty
        - collection
    CatalogFinialOption:
      type: object
      description: A discrete finial (umbrella pole-cap) choice. Default-or-required selection like a finish; upcharge options add to the line price. Text-only (no swatch image).
      properties:
        id:
          type: integer
        code:
          type: string
          description: Short finial code (e.g. "VF", "BF", "SS-VF").
        name:
          type: string
          description: Display name (e.g. "Chrome Vertex Finial").
        isDefault:
          type: boolean
          description: When true, this option is pre-selected on load.
        upchargeMsrp:
          type: string
          description: Decimal MSRP upcharge added when this finial is selected ("0" for no upcharge).
        upchargeSale:
          type: string
          description: Decimal customer-facing (discounted) upcharge for this finial ("0" for no upcharge).
        displayOrder:
          type: integer
      required:
        - id
        - code
        - name
        - isDefault
        - upchargeMsrp
        - upchargeSale
        - displayOrder
    CatalogFabricOption:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        itemNumber:
          type: string
        manufacturerName:
          type: string
        manufacturerLogoUrl:
          type: ["string", "null"]
        collection:
          type: ["string", "null"]
          description: Optional sub-grouping within a manufacturer (e.g. "Sunbrella", "Belenos"). Used to render collection subsections on the Fabrics page. Optional — only populated by the public fabrics catalog.
        swatchImageUrl:
          type: ["string", "null"]
        grade:
          type: ["string", "null"]
          description: Fabric grade (e.g. "A", "B", "C"). Affects price tiers.
        colorFamily:
          type: ["string", "null"]
          description: Normalized color family (e.g. "Blue", "Beige") used for filtering.
        isStripe:
          type: boolean
          description: When true, this fabric is a stripe pattern. Umbrellas ordered with a stripe fabric must be purchased in even pairs (quantity 2, 4, 6...).
        notes:
          type: ["string", "null"]
          description: Free-text vendor note for this fabric (e.g. "Non-stock. Allow additional lead time."). Shown as an inline callout when the fabric is selected.
        availabilityCodes:
          type: ["string", "null"]
          description: Pipe-delimited product-type availability codes (e.g. "S|C|U"). Used to show and filter fabrics by the product types they apply to (S=Sling, A=Air, PS=Padded Sling, C=Cushion, U=Umbrella, V=Vintage Wire, W=Welt).
        displayOrder:
          type: integer
      required:
        - id
        - name
        - itemNumber
        - manufacturerName
        - manufacturerLogoUrl
        - swatchImageUrl
        - grade
        - colorFamily
        - isStripe
        - notes
        - availabilityCodes
        - displayOrder
