        billingAddressId: { type: ["integer", "null"] }
        customShippingAddress:
          description: "One-off direct-ship address entered by staff. Only valid when shipToStore=false and shippingAddressId is null. Server creates a new addresses row attached to the order's customer (so it shows on the receipt and the vendor PO Ship-To). Requires a customerId (existing or newly-created), so not available for quick orders."
          type: ["object", "null"]
          properties:
            recipientName: { type: ["string", "null"] }
            street1: { type: string, minLength: 1 }
            street2: { type: ["string", "null"] }
            city: { type: string, minLength: 1 }
            state: { type: string, minLength: 2, maxLength: 2 }
            zip: { type: string, minLength: 1 }
            country: { type: string, default: "US" }
            phone: { type: ["string", "null"] }
          required: [street1, city, state, zip]
        shippingMethod: { type: ["string", "null"] }
        deliveryAmount: { type: number, minimum: 0, default: 0 }
        taxRate: { type: number, minimum: 0, maximum: 1, default: 0, description: "Decimal tax rate, e.g. 0.0875 for 8.75%" }
        depositAmount: { type: number, minimum: 0, default: 0 }
        salespersonName: { type: ["string", "null"] }
        specialInstructions: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        orderType: { type: string, enum: [online, in_store, phone], default: in_store }
        status: { type: string, default: pending }
        isQuickOrder: { type: boolean, default: false, description: "Quick in-store sale of stock on hand. Allows null customerId and unlocks skipVendorOrder." }
        skipVendorOrder: { type: boolean, default: false, description: "When true, vendor PO generation is blocked for this order. Use for quick stock-on-hand sales that should not trigger restock." }
        walkInName: { type: ["string", "null"], description: "Optional walk-in customer name when no customerId is provided" }
        walkInEmail: { type: ["string", "null"] }
        walkInPhone: { type: ["string", "null"] }
        isInternalRestock: { type: boolean, default: false, description: "Internal inventory restock order with no customer, addresses, pricing, or tax. Items are grouped by manufacturer into vendor orders automatically on creation." }
        shipToStore: { type: boolean, default: true, description: "When true (default) vendor PO ships to Oasis store. When false, requires shippingAddressId so vendor drop-ships direct to the customer." }
