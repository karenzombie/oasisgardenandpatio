    CreateInventoryAdjustmentRequest:
      type: object
      description: |
        Apply a manual change to one inventory SKU. Provide either `quantityChange`
        (signed delta) for a relative bump OR `setOnHand` (absolute) for an audit
        recount — exactly one of the two is required. `variantId` and `fabricId`
        select which (product, variant, fabric) row is being adjusted; both default
        to null for a flat product.
      properties:
        productId: { type: integer }
        variantId: { type: ["integer", "null"] }
        fabricId: { type: ["integer", "null"] }
        locationId:
          type: ["integer", "null"]
          description: Defaults to current default location when null.
        adjustmentType: { $ref: "#/components/schemas/InventoryAdjustmentType" }
        quantityChange:
          type: ["integer", "null"]
          description: Signed delta (positive to add, negative to remove). Cannot be zero. Mutually exclusive with `setOnHand`.
        setOnHand:
          type: ["integer", "null"]
          minimum: 0
          description: Absolute on-hand value to set (audit recount). Mutually exclusive with `quantityChange`.
        reason: { type: ["string", "null"] }
      required: [productId, adjustmentType]
    AdjustInventoryResponse:
      type: object
      properties:
        productId: { type: integer }
        variantId: { type: ["integer", "null"] }
        fabricId: { type: ["integer", "null"] }
