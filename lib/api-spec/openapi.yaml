        pdfStorageUrl: { type: string, nullable: true }
        noChanges:
          type: boolean
          description: "When true, this is a plain 'Resend (no changes)' — send the original PO email template (subject prefixed RESENT:) instead of the Revised PO template. Ignored on the first send."
