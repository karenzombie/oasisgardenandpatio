        upchargeSale:
          type: string
          description: Server-derived discounted upcharge ("0" for none).
        minOrderQty:
          type: ["integer", "null"]
          description: Minimum order quantity enforced when this finish is selected. Null means no finish-driven minimum.
      required:
        - finishId
        - upchargeMsrp
        - upchargeSale
        - minOrderQty
    AdminUpdateProductFinishesRequest:
      type: object
      properties:
        manufacturerIds:
          type: array
          items: { type: integer }
          description: Replace pools with these manufacturer IDs.
        finishIds:
          type: array
          items: { type: integer }
          description: Replace individual finish picks with these finish IDs.
        upcharges:
          type: array
          description: >-
            MSRP upcharge per individually-picked finish. The sale upcharge is
