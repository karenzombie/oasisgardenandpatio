                type: array
                items: { $ref: "#/components/schemas/AdminCancellationRequest" }
  /admin/cancellation-requests/{id}/review:
    post:
      operationId: adminReviewCancellationRequest
      tags: [admin-orders]
      summary: Approve or deny a cancellation request
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewCancellationRequest" }
      responses:
        "200":
          description: Updated cancellation request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCancellationRequest" }
        "400": { description: Bad request, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /admin/vendor-orders:
    get:
      operationId: adminListVendorOrders
      tags: [admin-vendor-orders]
      summary: List vendor orders (filterable by bucket/status/manufacturer/customer order/search)
      parameters:
        - name: bucket
          in: query
          required: false
          description: "needs_action = pending; sent = everything else"
          schema: { type: string, enum: [needs_action, sent] }
        - name: status
          in: query
          required: false
          schema: { type: string }
        - name: manufacturerId
          in: query
          required: false
          schema: { type: integer }
        - name: customerOrderId
          in: query
          required: false
          schema: { type: integer }
        - name: q
          in: query
          required: false
          description: Match vendor order number or customer order number
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Vendor orders page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminVendorOrderPage" }
  /admin/vendor-orders/{id}:
    get:
      operationId: adminGetVendorOrder
      tags: [admin-vendor-orders]
      summary: Vendor order detail (items, sends history, customer order summary)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Vendor order detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminVendorOrderDetail" }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    patch:
      operationId: adminUpdateVendorOrder
      tags: [admin-vendor-orders]
      summary: Update vendor order notes / vendor ETA
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateVendorOrderRequest" }
      responses:
        "200":
          description: Updated vendor order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminVendorOrderDetail" }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      operationId: adminDeleteVendorOrder
      tags: [admin-vendor-orders]
      summary: Delete a pending vendor order (un-assigns its items)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Deleted }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: Cannot delete after sending, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /admin/orders/{orderId}/vendor-orders/generate:
    post:
      operationId: adminGenerateVendorOrders
      tags: [admin-vendor-orders]
      summary: Auto-generate vendor orders for unassigned items in a customer order, grouped by manufacturer
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GenerateVendorOrdersRequest" }
      responses:
        "200":
          description: Generated vendor orders summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenerateVendorOrdersResponse" }
        "404": { description: Order not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /admin/vendor-orders/{id}/send:
    post:
      operationId: adminSendVendorOrder
      tags: [admin-vendor-orders]
      summary: Record a vendor order send (first send sets status=sent; subsequent sends are resends)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendVendorOrderRequest" }
      responses:
        "200":
          description: Updated vendor order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminVendorOrderDetail" }
        "400": { description: Bad request, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /admin/vendor-orders/{id}/status:
    post:
      operationId: adminUpdateVendorOrderStatus
      tags: [admin-vendor-orders]
      summary: Move a vendor order to a new status (acknowledged or fulfilled). Use /receive for received, /cancel for canceled.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateVendorOrderStatusRequest" }
      responses:
        "200":
          description: Updated vendor order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminVendorOrderDetail" }
        "400": { description: Bad request, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: Invalid transition, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /admin/vendor-orders/{id}/receive:
    post:
      operationId: adminReceiveVendorOrder
      tags: [admin-vendor-orders]
      summary: Mark a vendor order's items as received (creates an inventory_receipts row)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReceiveVendorOrderRequest" }
      responses:
        "200":
          description: Updated vendor order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminVendorOrderDetail" }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: Invalid state for receive, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /admin/vendor-orders/{id}/cancel:
    post:
      operationId: adminCancelVendorOrder
      tags: [admin-vendor-orders]
      summary: Cancel a vendor order (un-assigns its items so they can be reassigned)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CancelVendorOrderRequest" }
      responses:
        "200":
          description: Updated vendor order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminVendorOrderDetail" }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: Already received or canceled, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /admin/reports/sales-summary:
    get:
      operationId: adminReportsSalesSummary
      tags: [admin-reports]
      summary: Aggregate sales totals across a date range
      parameters:
        - name: dateFrom
          in: query
          required: false
          description: Inclusive lower bound on placedAt (ISO date or datetime). Defaults to 30 days ago.
          schema: { type: string }
        - name: dateTo
          in: query
          required: false
          description: Inclusive upper bound on placedAt (ISO date or datetime). Defaults to now.
          schema: { type: string }
        - name: includeCanceled
          in: query
          required: false
          description: When true, include canceled+refunded orders in the totals (defaults to false).
          schema: { type: boolean }
      responses:
        "200":
          description: Sales summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminReportsSalesSummary" }
  /admin/reports/sales-by-agent:
    get:
      operationId: adminReportsSalesByAgent
      tags: [admin-reports]
      summary: Sales aggregated by sales agent (createdByAgentId)
      parameters:
        - name: dateFrom
          in: query
          required: false
          schema: { type: string }
        - name: dateTo
          in: query
          required: false
          schema: { type: string }
        - name: includeCanceled
          in: query
          required: false
          schema: { type: boolean }
        - name: format
          in: query
          required: false
          description: When 'csv', returns text/csv instead of JSON.
          schema: { type: string, enum: [json, csv] }
      responses:
        "200":
          description: Sales by agent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminReportsSalesByAgent" }
            text/csv:
              schema: { type: string }
  /admin/reports/sales-by-manufacturer:
    get:
      operationId: adminReportsSalesByManufacturer
      tags: [admin-reports]
      summary: Sales aggregated by manufacturer (via order_items → products)
      parameters:
        - name: dateFrom
          in: query
          required: false
          schema: { type: string }
        - name: dateTo
          in: query
          required: false
          schema: { type: string }
        - name: includeCanceled
          in: query
          required: false
          schema: { type: boolean }
        - name: format
          in: query
          required: false
          schema: { type: string, enum: [json, csv] }
      responses:
        "200":
          description: Sales by manufacturer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminReportsSalesByManufacturer" }
            text/csv:
              schema: { type: string }
  /admin/reports/sales-by-category:
    get:
      operationId: adminReportsSalesByCategory
      tags: [admin-reports]
      summary: Sales aggregated by product category (via order_items → products)
      parameters:
        - name: dateFrom
          in: query
          required: false
          schema: { type: string }
        - name: dateTo
          in: query
          required: false
          schema: { type: string }
        - name: includeCanceled
          in: query
          required: false
          schema: { type: boolean }
        - name: format
          in: query
          required: false
          schema: { type: string, enum: [json, csv] }
      responses:
        "200":
          description: Sales by category
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminReportsSalesByCategory" }
            text/csv:
              schema: { type: string }
  /staff/notifications:
    get:
      operationId: staffListNotifications
      tags: [staff-notifications]
      summary: List the current staff user's notifications (newest first)
      parameters:
        - name: unreadOnly
          in: query
          required: false
          schema: { type: boolean }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StaffNotification" }
  /staff/notifications/unread-count:
    get:
      operationId: staffGetUnreadNotificationCount
      tags: [staff-notifications]
      summary: Get count of unread notifications for the current staff user
      responses:
        "200":
          description: Unread count
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffUnreadCount" }
  /staff/notifications/{id}/read:
    post:
      operationId: staffMarkNotificationRead
      tags: [staff-notifications]
      summary: Mark a single notification as read
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffNotification" }
        "404":
          description: Not found
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /staff/notifications/read-all:
    post:
      operationId: staffMarkAllNotificationsRead
      tags: [staff-notifications]
      summary: Mark every unread notification for the current staff user as read
