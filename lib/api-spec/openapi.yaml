          type: number
          nullable: true
          description: "Per-unit cost from the product record (staff-only, never printed on the PO). Null when there is no cost data for the line."
        edited:
          type: boolean
          description: "True when this line differs from the customer's original order (drives the staff-only red flag). Never printed on the PO."
        kind:
          type: string
          enum: [product, fabric]
          description: "'product' = the product line on the product vendor's PO. 'fabric' = a fabric-only line that was split out to an alternate fabric vendor's PO."
        addons:
          type: array
          description: "Add-on snapshots (e.g. Marella privacy walls) ordered alongside the parent line. Rendered as SKU/name/qty sub-lines on the PO PDF and email — never with pricing."
