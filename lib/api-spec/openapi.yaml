openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Oasis Garden & Patio API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: legal
    description: Legal document operations
  - name: banners
    description: Site notifications
  - name: manufacturers
    description: Manufacturers
  - name: categories
    description: Product categories
  - name: products
    description: Products
  - name: auth
    description: Authentication and account management
  - name: staff-auth
    description: Staff (agent / admin) authentication, 2FA, and password change
  - name: storage
    description: File upload and object storage
  - name: admin-manufacturers
    description: Admin CRUD for manufacturers
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /legal/{type}:
    get:
      operationId: getLegalDocument
      tags: [legal]
      summary: Get the currently active legal document for a given type
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [privacy_policy, terms_and_conditions]
      responses:
        "200":
          description: The active legal document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalDocument"
        "404":
          description: No active document found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /banners/active:
    get:
      operationId: listActiveBanners
      tags: [banners]
      summary: List currently active site-wide banners
      responses:
        "200":
          description: Active banners
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Banner"
  /manufacturers:
    get:
      operationId: listManufacturers
      tags: [manufacturers]
      summary: List active manufacturers
      responses:
        "200":
          description: Active manufacturers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Manufacturer"
  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List active categories
      responses:
        "200":
          description: Active categories (top-level and nested)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
  /products/featured:
    get:
      operationId: listFeaturedProducts
      tags: [products]
      summary: Featured products for the homepage
      responses:
        "200":
          description: Featured products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeaturedProduct"
  /auth/signup:
    post:
      operationId: signup
      tags: [auth]
      summary: Create a new customer account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "201":
          description: Account created and logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      responses:
        "204":
          description: Session ended
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the currently authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/verify-email:
    post:
      operationId: verifyEmail
      tags: [auth]
      summary: Verify an email address using a token from the verification email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
      responses:
        "200":
          description: Email verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "400":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/resend-verification:
    post:
      operationId: resendVerification
      tags: [auth]
      summary: Resend the verification email for the current user
      responses:
        "204":
          description: Verification email sent (or skipped if already verified)
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/request-password-reset:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      summary: Send a password reset email if the address is registered
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestPasswordResetRequest"
      responses:
        "204":
          description: Always returns success (does not disclose whether the email exists)
  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Reset a password using a token from the reset email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: Password updated
        "400":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/staff/login:
    post:
      operationId: staffLogin
      tags: [staff-auth]
      summary: Begin staff login (email + password). Returns the next stage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffLoginRequest"
      responses:
        "200":
          description: Login accepted; returns next required stage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffStageResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/staff/state:
    get:
      operationId: staffGetState
      tags: [staff-auth]
      summary: Get current staff session stage
      responses:
        "200":
          description: Current stage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffStageResponse"
        "401":
          description: Not in any staff session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffStageResponse"
  /auth/staff/2fa/setup-init:
    post:
      operationId: staffSetupTotp
      tags: [staff-auth]
      summary: Generate a new TOTP secret for first-time enrollment
      responses:
        "200":
          description: QR code and manual entry key for an authenticator app
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpSetupInitResponse"
        "400":
          description: Not in setup stage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/staff/2fa/setup-verify:
    post:
      operationId: staffVerifySetupTotp
      tags: [staff-auth]
      summary: Confirm TOTP enrollment with the first 6-digit code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpCodeRequest"
      responses:
        "200":
          description: Enrollment complete; returns recovery codes (shown once)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffStageResponse"
        "400":
          description: Invalid code or not in setup stage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/staff/2fa/verify:
    post:
      operationId: staffVerifyTotp
      tags: [staff-auth]
      summary: Verify TOTP code for an already-enrolled user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpCodeRequest"
      responses:
        "200":
          description: Code verified; returns next stage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffStageResponse"
        "400":
          description: Invalid code or not in verify stage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/staff/2fa/recovery:
    post:
      operationId: staffVerifyRecoveryCode
      tags: [staff-auth]
      summary: Use a one-time recovery code instead of a TOTP code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoveryCodeRequest"
      responses:
        "200":
          description: Recovery code consumed; returns next stage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffStageResponse"
        "400":
          description: Invalid recovery code or not in verify stage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/staff/change-password:
    post:
      operationId: staffChangePassword
      tags: [staff-auth]
      summary: Change the current staff user's password (also clears must_change_password)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password changed; returns next stage (usually complete)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffStageResponse"
        "400":
          description: Invalid current password or weak new password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/staff/2fa/disable:
    post:
      operationId: staffDisableTotp
      tags: [staff-auth]
      summary: Disable TOTP for the current admin (admins only)
      responses:
        "200":
          description: TOTP disabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: [ok]
        "403":
          description: Only admins may disable their own 2FA
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/manufacturers:
    get:
      operationId: adminListManufacturers
      tags: [admin-manufacturers]
      summary: List all manufacturers (active and inactive) for admin
      responses:
        "200":
          description: All manufacturers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminManufacturer"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: adminCreateManufacturer
      tags: [admin-manufacturers]
      summary: Create a new manufacturer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateManufacturerRequest"
      responses:
        "201":
          description: Manufacturer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminManufacturer"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Duplicate slug
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/manufacturers/{id}:
    put:
      operationId: adminUpdateManufacturer
      tags: [admin-manufacturers]
      summary: Update a manufacturer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateManufacturerRequest"
      responses:
        "200":
          description: Manufacturer updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminManufacturer"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Duplicate slug
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/manufacturers/{id}/active:
    patch:
      operationId: adminSetManufacturerActive
      tags: [admin-manufacturers]
      summary: Activate or deactivate a manufacturer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetActiveRequest"
      responses:
        "200":
          description: Updated manufacturer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminManufacturer"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a presigned URL for uploading a file (staff only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestUploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestUploadUrlResponseSchema"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not staff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    LegalDocument:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [privacy_policy, terms_and_conditions]
        version:
          type: string
        content:
          type: string
        effectiveDate:
          type: string
          format: date
      required:
        - id
        - type
        - version
        - content
        - effectiveDate
    Banner:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        messageText:
          type: string
        type:
          type: string
          enum: [popup, banner]
      required:
        - id
        - title
        - messageText
        - type
    Manufacturer:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
      required:
        - id
        - name
        - slug
    AdminManufacturer:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        description:
          type: ["string", "null"]
        logoUrl:
          type: ["string", "null"]
        website:
          type: ["string", "null"]
        displayOrder:
          type: integer
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - slug
        - description
        - logoUrl
        - website
        - displayOrder
        - isActive
        - createdAt
        - updatedAt
    CreateManufacturerRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        slug:
          type: string
          minLength: 1
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        description:
          type: ["string", "null"]
        logoUrl:
          type: ["string", "null"]
        website:
          type: ["string", "null"]
        displayOrder:
          type: integer
          default: 0
        isActive:
          type: boolean
          default: true
      required:
        - name
        - slug
    UpdateManufacturerRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        slug:
          type: string
          minLength: 1
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        description:
          type: ["string", "null"]
        logoUrl:
          type: ["string", "null"]
        website:
          type: ["string", "null"]
        displayOrder:
          type: integer
        isActive:
          type: boolean
      required:
        - name
        - slug
    SetActiveRequest:
      type: object
      properties:
        isActive:
          type: boolean
      required:
        - isActive
    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        parentId:
          type: ["integer", "null"]
        displayOrder:
          type: integer
      required:
        - id
        - name
        - slug
        - parentId
        - displayOrder
    FeaturedProduct:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        sku:
          type: string
        manufacturerName:
          type: string
        categoryName:
          type: string
        price:
          type: ["string", "null"]
        showPriceOnline:
          type: boolean
        availableOnline:
          type: boolean
        primaryImageUrl:
          type: ["string", "null"]
      required:
        - id
        - name
        - slug
        - sku
        - manufacturerName
        - categoryName
        - price
        - showPriceOnline
        - availableOnline
        - primaryImageUrl
    CurrentUser:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        role:
          type: string
          enum: [customer, agent, admin]
        emailVerified:
          type: boolean
      required:
        - id
        - email
        - firstName
        - lastName
        - role
        - emailVerified
    SignupRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        phone:
          type: string
      required:
        - email
        - password
        - firstName
        - lastName
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
      required:
        - email
        - password
    VerifyEmailRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
      required:
        - token
    RequestPasswordResetRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
        - email
    ResetPasswordRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
        newPassword:
          type: string
          minLength: 8
      required:
        - token
        - newPassword
    StaffUser:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        role:
          type: string
          enum: [agent, admin]
        twoFactorEnabled:
          type: boolean
        mustChangePassword:
          type: boolean
      required:
        - id
        - email
        - firstName
        - lastName
        - role
        - twoFactorEnabled
        - mustChangePassword
    StaffLoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
      required:
        - email
        - password
    StaffStageResponse:
      type: object
      properties:
        stage:
          type: string
          enum:
            - anonymous
            - needs_2fa_setup
            - needs_2fa_verify
            - needs_password_change
            - complete
        user:
          $ref: "#/components/schemas/StaffUser"
        recoveryCodes:
          type: array
          items:
            type: string
        recoveryCodesRemaining:
          type: integer
      required:
        - stage
    TotpSetupInitResponse:
      type: object
      properties:
        otpAuthUrl:
          type: string
        qrDataUrl:
          type: string
        manualEntryKey:
          type: string
      required:
        - otpAuthUrl
        - qrDataUrl
        - manualEntryKey
    TotpCodeRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 6
          maxLength: 8
      required:
        - code
    RecoveryCodeRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 8
      required:
        - code
    ChangePasswordRequest:
      type: object
      properties:
        currentPassword:
          type: string
          minLength: 1
        newPassword:
          type: string
          minLength: 12
      required:
        - currentPassword
        - newPassword
    RequestUploadUrlRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 0
        contentType:
          type: string
          minLength: 1
      required:
        - name
        - size
        - contentType
    RequestUploadUrlResponseSchema:
      type: object
      properties:
        uploadURL:
          type: string
        objectPath:
          type: string
        metadata:
          type: object
          properties:
            name:
              type: string
            size:
              type: integer
            contentType:
              type: string
          required:
            - name
            - size
            - contentType
      required:
        - uploadURL
        - objectPath
        - metadata
