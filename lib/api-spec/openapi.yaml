          type: ["integer", "null"]
          description: "Frame-finish choice for grade-priced (3-step) products. Recovers the finish code/name snapshots for the order line and vendor PO."
        finialId:
          type: ["integer", "null"]
          description: "Finial (umbrella pole-cap) choice. Recovers the finial code/name snapshots for the order line and vendor PO."
