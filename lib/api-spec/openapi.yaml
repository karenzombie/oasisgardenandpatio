    CartItem:
      type: object
      properties:
        id:
          type: integer
        productId:
          type: integer
        name:
          type: string
        slug:
          type: string
        sku:
          type: string
        manufacturerName:
          type: ["string", "null"]
        primaryImageUrl:
          type: ["string", "null"]
        unitPrice:
          type: string
          description: Price snapshotted at the time the item was added.
        quantity:
          type: integer
          minimum: 1
        lineTotal:
          type: string
        shippingAmount:
          type: string
          description: Per-item shipping for this line — the sum of all stacked shipping rules that match the product (flat × qty and/or % of line total). "0.00" when no rule matches.
        availableOnline:
          type: boolean
        variantId:
          type: ["integer", "null"]
        variantName:
          type: ["string", "null"]
        finishId:
          type: ["integer", "null"]
        finishName:
          type: ["string", "null"]
        finialId:
          type: ["integer", "null"]
        finialName:
          type: ["string", "null"]
        fabricId:
          type: ["integer", "null"]
        fabricName:
          type: ["string", "null"]
        fabricItemNumber:
          type: ["string", "null"]
        fabricIsStripe:
          type: boolean
          description: True when the selected fabric is a stripe pattern (quantity must be ordered in even pairs).
        minOrderQty:
          type: ["integer", "null"]
          description: Effective minimum order quantity for this line — the larger of the variant's and the selected frame finish's minimums. Null when no floor applies.
        minQtyFromFinish:
          type: boolean
          description: True when the selected frame finish drives the minimum-quantity floor; the cart shows the finish note (which takes precedence over the stripe note).
        addons:
          type: array
          description: Selected add-on lines for this cart item (e.g. privacy walls). Each carries its own per-unit price; lineTotal already includes them.
          items:
            $ref: "#/components/schemas/CartItemAddon"
        parentCartItemId:
          type: ["integer", "null"]
          description: When set, this line is an accessory tied 1:1 to the referenced parent line (the Aluminum Top Cover -> its galvanized base). Removed with the parent; quantity is kept in lockstep.
        isAccessory:
          type: boolean
          description: True when this line is a tied accessory (a top cover) that should be rendered grouped under its parent line.
        quantityLocked:
          type: boolean
          description: True when the customer cannot edit this line's quantity directly (it is driven by its parent line).
      required:
        - id
        - productId
        - name
        - slug
        - sku
        - manufacturerName
        - primaryImageUrl
        - unitPrice
        - quantity
        - lineTotal
        - shippingAmount
        - availableOnline
        - variantId
        - variantName
        - finishId
        - finishName
        - finialId
        - finialName
        - fabricId
        - fabricName
        - fabricItemNumber
        - fabricIsStripe
        - minOrderQty
        - minQtyFromFinish
        - addons
        - parentCartItemId
        - isAccessory
        - quantityLocked
    CartItemAddon:
      type: object
      description: A snapshot of one add-on attached to a cart line item.
      properties:
        addonOptionId:
          type: integer
        sku:
          type: string
        name:
          type: string
        unitPrice:
          type: string
          description: Per-unit add-on price snapshotted at add time.
        quantity:
          type: integer
          description: How many of this add-on per parent-line unit (e.g. 2 half-curtain pairs when two walls are selected).
        lineAmount:
          type: string
          description: unitPrice multiplied by the add-on quantity and the cart line quantity.
      required:
        - addonOptionId
        - sku
        - name
        - unitPrice
        - quantity
        - lineAmount
    CartResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItem"
        itemCount:
          type: integer
          description: Sum of quantities across all line items.
        subtotal:
          type: string
        shipping:
          type: string
          description: Total shipping for the cart — sum of every line's stacked rules plus the matching by-weight tier. "0.00" when nothing matches. Replaces "Calculated at checkout".
        shippingWeightAmount:
          type: string
          description: The order-level by-weight shipping tier amount included in shipping (Area E), in dollars.
      required:
        - items
        - itemCount
        - subtotal
        - shipping
        - shippingWeightAmount
    AddCartItemRequest:
      type: object
      properties:
        productId:
          type: integer
        quantity:
          type: integer
          minimum: 1
          default: 1
        variantId:
          type: ["integer", "null"]
          description: Required when the product has variants (e.g. frame finish).
        fabricId:
          type: ["integer", "null"]
          description: Required when the product has fabric options.
        finishId:
          type: ["integer", "null"]
          description: Selected frame-finish id for grade-priced (3-step) products.
        finialId:
          type: ["integer", "null"]
          description: Selected finial (umbrella pole-cap) id. Required when the product has finial options.
        addonOptionIds:
          type: array
          items:
            type: integer
          description: Selected add-on option IDs (e.g. privacy walls) to attach to this line. Pairing-required add-ons are auto-enforced server-side.
        stemProductId:
          type: ["integer", "null"]
          description: Optional galvanized-base stem accessory. When set, the stem is added as a SEPARATE, independent cart line (quantity matches the base add).
        coverFinishId:
          type: ["integer", "null"]
          description: Optional Aluminum Top Cover finish id. When set, the cover is added as a SEPARATE cart line tied 1:1 to the base line (locked quantity).
      required:
        - productId
    UpdateCartItemRequest:
      type: object
      properties:
        quantity:
          type: integer
          minimum: 1
      required:
        - quantity
