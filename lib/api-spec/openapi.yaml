        finishIds:
          type: array
          items: { type: integer }
          description: Individually-picked finish IDs (extra finishes on top of any pools).
        upcharges:
          type: array
          description: Per-(picked finish) frame upcharge values. Only individually-picked finishes carry an upcharge; pooled finishes are always 0.
