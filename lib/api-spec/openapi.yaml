openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Oasis Garden & Patio API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: legal
    description: Legal document operations
  - name: banners
    description: Site notifications
  - name: manufacturers
    description: Manufacturers
  - name: categories
    description: Product categories
  - name: products
    description: Products
  - name: auth
    description: Authentication and account management
  - name: staff-auth
    description: Staff (agent / admin) authentication, 2FA, and password change
  - name: storage
    description: File upload and object storage
  - name: admin-manufacturers
    description: Admin CRUD for manufacturers
  - name: admin-categories
    description: Admin CRUD for product categories
  - name: cushions
    description: Custom cushion order form (public submit, staff review)
  - name: analytics
    description: Visitor / funnel analytics ingestion (public) and reporting (admin)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /legal/{type}:
    get:
      operationId: getLegalDocument
      tags: [legal]
      summary: Get the currently active legal document for a given type
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [privacy_policy, terms_and_conditions, shipping_returns, warranty]
      responses:
        "200":
          description: The active legal document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalDocument"
        "404":
          description: No active document found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /banners/active:
    get:
      operationId: listActiveBanners
      tags: [banners]
      summary: List currently active site-wide banners
      responses:
        "200":
          description: Active banners
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Banner"
  /manufacturers:
    get:
      operationId: listManufacturers
      tags: [manufacturers]
      summary: List active manufacturers
      responses:
        "200":
          description: Active manufacturers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Manufacturer"
  /materials:
    get:
      operationId: listMaterials
      tags: [materials]
      summary: List active materials
      responses:
        "200":
          description: Active materials
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Material"
  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List active categories
      responses:
        "200":
          description: Active categories (top-level and nested)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
  /products/featured:
    get:
      operationId: listFeaturedProducts
      tags: [products]
      summary: Featured products for the homepage
      responses:
        "200":
          description: Featured products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeaturedProduct"
  /products/popular:
    get:
      operationId: getPopularProduct
      tags: [products]
      summary: The single most popular product (refreshed weekly)
      description: >
        Returns the single product with the highest combined popularity score
        across all order types (online + in-store) and wishlist additions over
        the most recent scoring window. Result is cached server-side and
        refreshed once per week.
      responses:
        "200":
          description: The most popular product, or null if none can be computed yet.
          content:
            application/json:
              schema:
                type: object
                properties:
                  product:
                    oneOf:
                      - $ref: "#/components/schemas/FeaturedProduct"
                      - type: "null"
                  refreshedAt:
                    type: string
                    description: ISO timestamp when the cache was last refreshed.
                required:
                  - product
                  - refreshedAt
  /products:
    get:
      operationId: listCatalogProducts
      tags: [products]
      summary: Public product listing with filters, sort, and pagination
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: categorySlug
          in: query
          required: false
          schema:
            type: string
        - name: manufacturerSlug
          in: query
          required: false
          schema:
            type: string
        - name: materialSlug
          in: query
          required: false
          schema:
            type: string
        - name: finish
          in: query
          required: false
          description: Filter by frame finish (case-insensitive variant name, e.g. "Black")
          schema:
            type: string
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [featured, newest, price_asc, price_desc, name_asc]
            default: featured
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 60
            default: 12
      responses:
        "200":
          description: Paginated catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogProductsPage"
  /catalog/finishes:
    get:
      operationId: listCatalogFinishes
      tags: [products]
      summary: Distinct frame finish values across all active products
      responses:
        "200":
          description: List of finish names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /catalog/fabrics:
    get:
      operationId: listCatalogFabrics
      tags: [products]
      summary: Public list of all active fabrics offered as product options
      responses:
        "200":
          description: Active fabrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogFabricsResponse"
  /products/by-slug/{slug}:
    get:
      operationId: getCatalogProductBySlug
      tags: [products]
      summary: Public product detail page payload
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogProductDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /account/addresses:
    get:
      operationId: listAccountAddresses
      tags: [account]
      summary: List the signed-in customer's saved addresses
      responses:
        "200":
          description: Addresses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountAddressesResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createAccountAddress
      tags: [account]
      summary: Save a new address to the signed-in customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountAddressInput"
      responses:
        "200":
          description: Updated addresses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountAddressesResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /account/addresses/{addressId}:
    patch:
      operationId: updateAccountAddress
      tags: [account]
      summary: Update one of the signed-in customer's saved addresses
      parameters:
        - name: addressId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountAddressInput"
      responses:
        "200":
          description: Updated addresses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountAddressesResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Address not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteAccountAddress
      tags: [account]
      summary: Delete one of the signed-in customer's saved addresses
      parameters:
        - name: addressId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated addresses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountAddressesResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Address not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /account/orders:
    get:
      operationId: listAccountOrders
      tags: [account]
      summary: List the signed-in customer's orders
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountOrdersResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /account/orders/{orderNumber}:
    get:
      operationId: getAccountOrder
      tags: [account]
      summary: Get a single order belonging to the signed-in customer
      parameters:
        - name: orderNumber
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountOrderDetail"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /checkout/quote:
    post:
      operationId: quoteCheckout
      tags: [checkout]
      summary: Compute shipping + tax for the signed-in customer's cart
      description: >-
        Returns the live shipping cost and sales tax for the current cart based
        on a destination state. Used by the checkout page to show realistic
        totals before the order is placed. The quote is informational: the
        server re-computes the same values when the order is actually placed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutQuoteRequest"
      responses:
        "200":
          description: Quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutQuoteResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /checkout:
    post:
      operationId: placeOrder
      tags: [checkout]
      summary: Place an order from the signed-in customer's cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaceOrderRequest"
      responses:
        "200":
          description: Order placed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaceOrderResult"
        "400":
          description: Invalid request or empty cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /wishlist:
    get:
      operationId: getWishlist
      tags: [wishlist]
      summary: List the signed-in user's wishlist items
      responses:
        "200":
          description: Wishlist items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WishlistResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: addWishlistItem
      tags: [wishlist]
      summary: Add a product to the signed-in user's wishlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddWishlistItemRequest"
      responses:
        "200":
          description: Wishlist after add
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WishlistResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /cart:
    get:
      operationId: getCart
      tags: [cart]
      summary: Get the signed-in user's cart
      responses:
        "200":
          description: Cart contents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: clearCart
      tags: [cart]
      summary: Remove all items from the signed-in user's cart
      responses:
        "200":
          description: Empty cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /cart/items:
    post:
      operationId: addCartItem
      tags: [cart]
      summary: Add a product to the signed-in user's cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddCartItemRequest"
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /cart/items/{itemId}:
    patch:
      operationId: updateCartItem
      tags: [cart]
      summary: Change the quantity of a cart line item
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCartItemRequest"
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Cart item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: removeCartItem
      tags: [cart]
      summary: Remove a line item from the cart
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /wishlist/lookup:
    post:
      operationId: lookupWishlistItems
      tags: [wishlist]
      summary: Public lookup — hydrate a list of product IDs into wishlist items
      description: >
        Used by the guest wishlist page to render the device-local
        wishlist (held in localStorage). Returns the same shape as
        GET /wishlist; for guest items, `id` is set to `productId` and
        `createdAt` is set to the current time since there is no
        underlying wishlist row. Hidden / inactive products are silently
        omitted, mirroring the auth wishlist visibility rules.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncWishlistRequest"
      responses:
        "200":
          description: Hydrated items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WishlistResponse"
  /wishlist/sync:
    post:
      operationId: syncWishlist
      tags: [wishlist]
      summary: Bulk-add products to the signed-in user's wishlist
      description: >-
        Used after sign-up or login to merge a guest's locally-held wishlist
        into the user's persistent wishlist. Existing items are silently
        skipped via ON CONFLICT DO NOTHING.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncWishlistRequest"
      responses:
        "200":
          description: Wishlist after merge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WishlistResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /wishlist/{productId}:
    delete:
      operationId: removeWishlistItem
      tags: [wishlist]
      summary: Remove a product from the signed-in user's wishlist
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Wishlist after removal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WishlistResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/signup:
    post:
      operationId: signup
      tags: [auth]
      summary: Create a new customer account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "201":
          description: Account created and logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      responses:
        "204":
          description: Session ended
  /auth/clerk-sync:
    post:
      operationId: clerkSync
      tags: [auth]
      summary: Bridge a Clerk session to a local user + session cookie
      description: |
        Called by the web client whenever the Clerk user transitions from
        signed-out to signed-in. Finds or provisions a local users row
        (linked by clerk_user_id), creates a matching customer record,
        merges any guest cart, and sets the local session cookie.
      responses:
        "200":
          description: Local user provisioned / linked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          description: No Clerk session present on the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Email already used by a legacy local account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the currently authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/verify-email:
    post:
      operationId: verifyEmail
      tags: [auth]
      summary: Verify an email address using a token from the verification email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
      responses:
        "200":
          description: Email verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "400":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/resend-verification:
    post:
      operationId: resendVerification
      tags: [auth]
      summary: Resend the verification email for the current user
      responses:
        "204":
          description: Verification email sent (or skipped if already verified)
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/request-password-reset:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      summary: Send a password reset email if the address is registered
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestPasswordResetRequest"
      responses:
        "204":
          description: Always returns success (does not disclose whether the email exists)
  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Reset a password using a token from the reset email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: Password updated
        "400":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/staff/login:
    post:
      operationId: staffLogin
      tags: [staff-auth]
      summary: Begin staff login (email + password). Returns the next stage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffLoginRequest"
      responses:
        "200":
          description: Login accepted; returns next required stage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffStageResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/staff/state:
    get:
      operationId: staffGetState
      tags: [staff-auth]
      summary: Get current staff session stage
      responses:
        "200":
          description: Current stage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffStageResponse"
        "401":
          description: Not in any staff session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffStageResponse"
  /auth/staff/2fa/setup-init:
    post:
      operationId: staffSetupTotp
      tags: [staff-auth]
      summary: Generate a new TOTP secret for first-time enrollment
      responses:
        "200":
          description: QR code and manual entry key for an authenticator app
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpSetupInitResponse"
        "400":
          description: Not in setup stage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/staff/2fa/setup-verify:
    post:
      operationId: staffVerifySetupTotp
      tags: [staff-auth]
      summary: Confirm TOTP enrollment with the first 6-digit code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpCodeRequest"
      responses:
        "200":
          description: Enrollment complete; returns recovery codes (shown once)
          content:
