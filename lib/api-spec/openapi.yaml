        - name: customerOrderId
          in: query
          required: false
          schema: { type: integer }
        - name: q
          in: query
          required: false
          description: Match vendor order number or customer order number
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Vendor orders page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminVendorOrderPage" }
  /admin/vendor-orders/{id}:
    get:
      operationId: adminGetVendorOrder
      tags: [admin-vendor-orders]
