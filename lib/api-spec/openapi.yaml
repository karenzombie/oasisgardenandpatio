        - grade
        - isActive
        - displayOrder
    AdminCreateFabricRequest:
      type: object
      properties:
        manufacturerId: { type: integer }
        itemNumber: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        swatchImageUrl: { type: ["string", "null"] }
        grade: { type: ["string", "null"] }
        isActive: { type: boolean }
