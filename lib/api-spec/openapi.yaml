  /auth/staff/recover/request:
    post:
      operationId: requestStaffRecovery
      tags: [staff-auth]
      summary: Request a delayed staff account recovery (locked out admins)
      description: |
        Always returns 200 (does not leak whether the email is registered). If
        the email matches an active staff account, an emailed recovery link is
        scheduled to become usable after a 1-hour cooldown, and all OTHER
        active admins are notified so they can cancel the request before it
        becomes usable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestStaffRecoveryRequest"
      responses:
        "200":
          description: Always returned, regardless of whether the email exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestStaffRecoveryResult"
        "429":
          description: Too many requests
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
