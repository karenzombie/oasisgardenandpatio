              schema: { $ref: "#/components/schemas/AuditLogPage" }
  /admin/orders:
    post:
      operationId: adminCreateOrder
      tags: [admin-orders]
      summary: Create an order (in-store agent builder)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrderRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOrderDetail" }
        "400": { description: Bad request, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    get:
      operationId: adminListOrders
      tags: [admin-orders]
      summary: List customer orders (newest first)
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string }
        - name: q
          in: query
          required: false
          description: Match order number, customer email, or customer name
          schema: { type: string }
        - name: customerId
          in: query
          required: false
          schema: { type: integer }
        - name: agentId
          in: query
          required: false
          schema: { type: integer }
        - name: includeRestocks
          in: query
          required: false
          description: Include internal inventory-restock orders in the results. Defaults to false.
          schema: { type: boolean }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Orders page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOrderPage" }
  /admin/orders/{id}:
    get:
      operationId: adminGetOrder
      tags: [admin-orders]
      summary: Order detail (items, addresses, history, vendor orders, cancellation)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Order detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOrderDetail" }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /admin/orders/{id}/status:
    post:
      operationId: adminUpdateOrderStatus
      tags: [admin-orders]
      summary: Move an order to a new status (writes order_status_history)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateOrderStatusRequest" }
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOrderDetail" }
        "400": { description: Bad request, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /admin/orders/{id}/refund:
    post:
      operationId: adminRefundOrder
      tags: [admin-orders]
      summary: Process a refund and transition an order to "refunded" status
      description: >-
        Marks the order as refunded. For online orders that have a card
        transaction on file, attempts a refund through Authorize.net for the
        net amount. Supports an optional restocking fee (flat $ or percentage)
        deducted before the gateway call. Sends a refund notification email; if
        a restocking fee applies the email includes a note about the reduction.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminRefundOrderRequest" }
      responses:
        "200":
          description: Refunded order detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOrderDetail" }
        "400": { description: Bad request, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: Order already in a non-refundable terminal state, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /admin/orders/{id}/totals:
    post:
      operationId: adminUpdateOrderTotals
      tags: [admin-orders]
      summary: Override the shipping and/or tax amounts on an order
      description: >-
        Manually set the delivery (shipping) amount and/or the tax amount for
        an order. The order's total and balance due are recomputed from
        subtotal + the new values; deposit is preserved. A status-history note
        is written so the override is auditable.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminUpdateOrderTotalsRequest" }
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOrderDetail" }
        "400": { description: Bad request, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /admin/orders/{id}/items:
    put:
      operationId: adminEditOrderItems
      tags: [admin-orders]
      summary: Edit line items on a staff-created order
      description: >-
        Replaces the items on a staff-created order (orderType != "online"). keepItems
        lists existing item IDs to retain with updated quantities; items not listed are
        deleted. newItems are added using the same snapshot resolution as order creation.
        Subtotal, total, and balance due are recomputed; tax, delivery, and deposit are
        preserved.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EditOrderItemsRequest" }
      responses:
        "200":
          description: Updated order detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOrderDetail" }
        "400": { description: Bad request, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { description: Forbidden – online orders cannot be edited, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /admin/deliveries/local:
    get:
      operationId: adminListLocalDeliveries
      tags: [admin-orders]
      summary: List incomplete local-delivery orders for the Deliveries > Local Deliveries tab
      description: >-
        Orders with status ready_for_store_delivery or out_for_local_delivery,
        sorted by scheduled_delivery_date ascending (NULLs last), then
        scheduled_delivery_time ascending (NULLs last).
      parameters:
        - name: filter
          in: query
          required: false
          description: "all (default) or unscheduled (scheduled_delivery_date IS NULL)"
          schema: { type: string, enum: [all, unscheduled] }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Local deliveries page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminLocalDeliveryPage" }
  /admin/deliveries/manifest-summary:
    get:
      operationId: adminGetDeliveryManifestSummaryPdf
      tags: [admin-orders]
      summary: Delivery Manifest Summary PDF for the checked orders (Brief 6, Section 3F Document 1)
      parameters:
        - name: orderIds
          in: query
          required: true
          description: Comma-separated order IDs, e.g. "12,45,9"
          schema: { type: string }
      responses:
        "200":
          description: PDF bytes
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "400": { description: Bad request, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /admin/deliveries/manifest-copies:
    get:
      operationId: adminGetDeliveryManifestCopiesPdf
      tags: [admin-orders]
      summary: Merged Delivery Copies PDF for the checked orders (Brief 6, Section 3F Document 2)
      parameters:
        - name: orderIds
          in: query
          required: true
          description: Comma-separated order IDs, e.g. "12,45,9"
          schema: { type: string }
      responses:
        "200":
          description: PDF bytes
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "400": { description: Bad request, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /admin/deliveries/direct-ship:
    get:
      operationId: adminListDirectShipDeliveries
      tags: [admin-orders]
      summary: List incomplete direct-ship orders for the Deliveries > Direct Ship tab
      description: >-
        Orders with status carrier_delivery_update that have at least one
        shipment with a non-null tracking_number. One row per shipment
        record (order number repeats when an order has multiple shipments),
        sorted by shipments.created_at descending. No filters.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Direct ship page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminDirectShipPage" }
  /admin/deliveries/completed:
    get:
      operationId: adminListCompletedDeliveries
      tags: [admin-orders]
      summary: List fully delivered orders (local and direct ship) for the Deliveries > Completed tab
      description: >-
        Orders with status delivered. Delivery Type is derived: Direct Ship
        if the order has at least one shipment with a non-null
        tracking_number, otherwise Local Delivery. Sorted by placedAt
        descending (same recency column as the existing Orders list).
      parameters:
        - name: filter
          in: query
          required: false
          description: "all (default), local, or direct-ship"
          schema: { type: string, enum: [all, local, direct-ship] }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Completed deliveries page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCompletedDeliveryPage" }
  /admin/orders/{orderId}/items/{itemId}/fabric-vendor:
    patch:
      operationId: adminUpdateOrderItemFabricVendor
      tags: [admin-orders]
      summary: Set or clear the alternate fabric vendor on a line item
      description: >-
        Staff-portal only. When `fabricVendorId` is non-null, this line's
        fabric is split out of the product vendor's PO and placed on a
        separate PO for the chosen fabric vendor. Setting it to null returns
        to the default behavior (fabric ships with the product vendor).
        Vendor POs are re-grouped after the change. The change is rejected
        with 409 if any vendor PO that currently includes this line is no
        longer in 'pending' status (i.e. already sent / fulfilled / received
        / canceled) — staff must cancel that PO first.
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: integer }
        - name: itemId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminSetOrderItemFabricVendorRequest" }
      responses:
        "200":
          description: Updated order detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOrderDetail" }
        "400": { description: Bad request, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: Conflict — line is on a non-pending vendor PO, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /admin/orders/{id}/notes:
    post:
      operationId: adminUpdateOrderNotes
      tags: [admin-orders]
      summary: Update internal notes on an order
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateOrderNotesRequest" }
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOrderDetail" }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /admin/cancellation-requests:
    get:
      operationId: adminListCancellationRequests
      tags: [admin-orders]
      summary: List cancellation requests (optionally filtered by status)
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Cancellation requests list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminCancellationRequest" }
  /admin/cancellation-requests/{id}/review:
    post:
      operationId: adminReviewCancellationRequest
      tags: [admin-orders]
      summary: Approve or deny a cancellation request
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewCancellationRequest" }
      responses:
        "200":
          description: Updated cancellation request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCancellationRequest" }
        "400": { description: Bad request, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /admin/vendor-orders:
    post:
      operationId: adminCreateStandaloneVendorOrder
      tags: [admin-vendor-orders]
      summary: Create a vendor order directly (no parent customer order)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateStandaloneVendorOrderRequest" }
      responses:
        "201":
          description: Created vendor order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminVendorOrderDetail" }
        "400": { description: Bad request, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: Manufacturer / product not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    get:
      operationId: adminListVendorOrders
      tags: [admin-vendor-orders]
      summary: List vendor orders (filterable by bucket/status/manufacturer/customer order/search)
      parameters:
        - name: bucket
          in: query
          required: false
          description: "needs_action = pending; sent = everything else"
          schema: { type: string, enum: [needs_action, sent] }
        - name: status
          in: query
          required: false
          schema: { type: string }
        - name: manufacturerId
          in: query
          required: false
          schema: { type: integer }
        - name: customerOrderId
          in: query
          required: false
          schema: { type: integer }
        - name: q
          in: query
          required: false
          description: Match vendor order number or customer order number
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Vendor orders page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminVendorOrderPage" }
