          type: ["string", "null"]
          description: "Fabric grade for grade-priced products (e.g. A, B, C). Used to snapshot the fabric grade + unit MSRP from variant_grade_prices."
        fabricId: { type: ["integer", "null"] }
        fabricVendorId:
          type: ["integer", "null"]
          description: "Staff-portal only. When set, this line's fabric ships from a separate vendor on its own PO instead of bundled with the product vendor's PO. Requires fabricId."
