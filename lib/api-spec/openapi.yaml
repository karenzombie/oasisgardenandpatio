    AdminBulkUpdateProductsFields:
      type: object
      description: Scalar product fields to set on every selected product. Omit a field to leave it unchanged. Use null on FK fields to clear them.
      properties:
        isActive: { type: boolean }
        featured: { type: boolean }
        inStoreOnly: { type: boolean }
        availableOnline: { type: boolean }
        quoteOnly: { type: boolean }
        showPriceOnline: { type: boolean }
        categoryId: { type: ["integer", "null"] }
        manufacturerId: { type: ["integer", "null"] }
        rankGroup: { type: ["integer", "null"] }
    AdminBulkPriceAdjustment:
      type: object
      description: Apply a flat dollar or percentage change to selected price columns across all chosen products.
      properties:
        fields:
          type: array
          items:
            type: string
            enum: [price, salePrice, cost, msrp, frameOnlyPrice]
          minItems: 1
          description: Which price columns to adjust. Columns that are NULL on a given product are skipped.
        mode:
          type: string
          enum: [flat, percent]
          description: flat = add/subtract a fixed dollar amount; percent = multiply the current value by (1 + amount/100).
        amount:
          type: number
          description: Positive = increase, negative = decrease. For percent mode 5 means +5%, -3 means -3%.
        roundTo:
          type: integer
          description: Decimal places to round adjusted values to (default 2).
      required: [fields, mode, amount]
    AdminBulkFabricPoolsChange:
      type: object
      description: How to mutate each product's fabric-pool manufacturer list.
      properties:
        mode:
          type: string
          enum: [replace, add, remove, clear]
        manufacturerIds:
          type: array
          items: { type: integer }
          description: Required for replace/add/remove; ignored for clear.
      required: [mode]
    AdminBulkFabricPicksChange:
      type: object
      description: How to mutate each product's individual fabric picks.
      properties:
        mode:
          type: string
          enum: [replace, add, remove, clear]
        fabricIds:
          type: array
          items: { type: integer }
          description: Required for replace/add/remove; ignored for clear.
      required: [mode]
    AdminBulkUpdateProductsRequest:
      type: object
      properties:
        productIds:
          type: array
          items: { type: integer }
          minItems: 1
          maxItems: 500
        fields:
          $ref: "#/components/schemas/AdminBulkUpdateProductsFields"
        fabricPools:
          $ref: "#/components/schemas/AdminBulkFabricPoolsChange"
        fabricPicks:
          $ref: "#/components/schemas/AdminBulkFabricPicksChange"
        priceAdjustments:
          $ref: "#/components/schemas/AdminBulkPriceAdjustment"
      required: [productIds]
    AdminBulkUpdateProductsResult:
      type: object
      properties:
        productsUpdated:
          type: integer
          description: How many products had their scalar fields changed.
        fabricsUpdated:
          type: integer
          description: How many products had their fabric pools or picks changed.
        pricesUpdated:
          type: integer
          description: How many products had at least one price field adjusted.
        notFound:
          type: array
          items: { type: integer }
          description: Product IDs that did not exist and were skipped.
      required: [productsUpdated, fabricsUpdated, pricesUpdated, notFound]
    EntityHistoryEntry:
      type: object
      properties:
