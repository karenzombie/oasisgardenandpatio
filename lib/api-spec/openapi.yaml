        itemNumber: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        swatchImageUrl: { type: ["string", "null"] }
        grade: { type: ["string", "null"] }
        isActive: { type: boolean }
        displayOrder: { type: integer }
    AdminProductFabricPool:
      type: object
